name: Continuous integration

# Checks and release live in the same file for a single reason: the release must be able to
# depend on the checks. Two separate workflows cannot wait for each other, and a tag would then
# put an image on the registry with no test having run.
#
# The trigger is `main`, the version tags and the pull requests, not every branch pushed: covering
# `**` would double every run as soon as a pull request is opened.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # The latest patch of the line the image builds with (`golang:1.26-alpine`), not go.mod's
  # minimum: govulncheck judges the standard library of the toolchain that runs it, and a release
  # is compiled with it.
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  KUSTOMIZE_VERSION: "5.8.1"
  KUSTOMIZE_SHA256: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
  KUBE_LINTER_VERSION: "0.8.3"
  KUBE_LINTER_SHA256: "1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df"
  BUILDKIT_IMAGE: moby/buildkit:v0.23.2
  IMAGE: ghcr.io/cadoles/arkhitekton
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  go:
    name: Formatting, static analysis and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Formatting and static analysis
        run: make lint

      # PostgreSQL and MinIO are real: applying a schema, SigV4 signing and reading by range are not
      # usefully simulated. The target starts them itself, as on a workstation: a service container
      # cannot be given its command, and the MinIO image has none.
      - name: Tests
        run: make test-integration

  vuln:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: govulncheck
        run: make vuln

  web:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the dependencies
        run: make web-install

      - name: Types, static analysis and tests
        run: make web-check

      - name: Build
        run: make web

  manifests:
    name: Manifests rendering and analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Install kustomize and kube-linter
        run: |
          set -eu
          cd /tmp

          curl -sSLo kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tgz" | sha256sum -c -
          tar xzf kustomize.tgz kustomize

          curl -sSLo kube-linter.tgz \
            "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          echo "${KUBE_LINTER_SHA256}  kube-linter.tgz" | sha256sum -c -
          tar xzf kube-linter.tgz kube-linter

          mkdir -p "${HOME}/.local/bin"
          install -m 0755 kustomize kube-linter "${HOME}/.local/bin/"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # The local overlay reads files that are not versioned: the environment and the pipelines'
      # credentials. Placeholders are enough to render and analyse, and none enters a rule checked.
      - name: Placeholders for the unversioned files
        run: |
          set -eu
          cp deploy/overlays/local/secrets/dashboard.env.example \
             deploy/overlays/local/secrets/dashboard.env
          credentials=deploy/overlays/local/components/pipeline-credentials
          touch "${credentials}/pipeline-ssh-key" "${credentials}/pipeline-known-hosts"
          echo '{"auths":{}}' > "${credentials}/pipeline-dockerconfig.json"

      - name: Render and analyse
        run: make manifests

  image:
    name: Image build
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # Built without being pushed, for the runner's platform only: the point is to see a broken
      # Dockerfile before a release does.
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}

      # The AI review's image, likewise: its downloads are checked against their checksums, and a
      # pinned version that disappeared shows here.
      - name: Build the review image without publishing
        uses: docker/build-push-action@v6
        with:
          context: images/review
          push: false

  release:
    name: Release
    # On a version tag only, and only after every check: a version is a named object whose tests
    # ran, never a branch's state.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [go, vuln, web, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4
        with:
          # The notes list the commits since the previous version tag.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build the binaries
        run: |
          make web-install
          make binaries RELEASE_VERSION="${GITHUB_REF_NAME}" RELEASE_REVISION="${GITHUB_SHA}"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Derive the tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            # The moving tags follow final versions only: a candidate become `latest` would be
            # delivered where a stable version was expected.
            if [[ "${version}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "${IMAGE}:v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              echo "${IMAGE}:v${BASH_REMATCH[1]}"
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      # The build stages cross-compile on the runner's platform: no emulator is needed.
      - name: Build and publish the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Links the package to the repository, whose visibility and permissions it then takes.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      - name: Write the notes
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eu
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${previous:+${previous}..}${GITHUB_REF_NAME}"
          {
            echo "Image: \`${IMAGE}:${GITHUB_REF_NAME}\` (${IMAGE_PLATFORMS})"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "## Changes${previous:+ since ${previous}}"
            echo
            git log --no-merges --format='- %s (%h)' "${range}"
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      # Last, so that a release always has its image. Replayed, it updates the release and replaces
      # its files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tags.outputs.prerelease }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" > /dev/null 2>&1; then
            gh release edit "${tag}" --title "${tag}" --notes-file "${RUNNER_TEMP}/notes.md" \
              --prerelease="${PRERELEASE}"
            gh release upload "${tag}" dist/arkhitekton-linux-* dist/SHA256SUMS --clobber
          else
            gh release create "${tag}" --verify-tag --title "${tag}" \
              --notes-file "${RUNNER_TEMP}/notes.md" --prerelease="${PRERELEASE}" \
              dist/arkhitekton-linux-* dist/SHA256SUMS
          fi
