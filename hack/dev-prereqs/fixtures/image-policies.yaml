# Sélection d'image par environnement — reproduction locale de ce que Flux porte
# en production (B7).
#
# Ces objets ne sont pas décoratifs : ce sont eux que le dashboard lit au
# démarrage pour vérifier que sa table `environments` dit la même chose que Flux.
# Une divergence entre les deux est exactement ce qui produit une promotion sans
# effet, et bloque donc le démarrage.
#
# Aucun contrôleur ne tourne : `status.latestImage` reste vide jusqu'à ce que le
# simulateur (`hack/fluxsim`, lot 5) l'alimente.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: portal
  namespace: flux-system
spec:
  # `reg.cadoles.com/vcarroy` remplace `cnous-mse` en local (doc 11 §11.4).
  image: reg.cadoles.com/vcarroy/portal
  interval: 5m
---
# unstable — accepte les pré-releases.
#
# Le suffixe `-0` de la plage n'est pas un détail : une plage SemVer sans
# composante de pré-release n'en sélectionne aucune. `>=0.0.0` ignorerait
# silencieusement toutes les RC promues vers cet environnement.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portal-unstable
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portal
  # `1.8.0-rc1_unstable` n'est pas du SemVer valide : la partie version doit être
  # extraite avant que l'ordre s'applique. L'underscore vient de la grammaire des
  # tags OCI, qui exclut le `+` des métadonnées SemVer.
  filterTags:
    pattern: '^(?P<semver>.+)_unstable$'
    extract: '$semver'
  policy:
    semver:
      range: '>=0.0.0-0'
---
# qualif — **le suffixe Flux est `testing`**, pas `qualif`.
#
# Ce n'est pas un alias de lecture pour compatibilité : c'est la valeur qui sert à
# construire le tag poussé. S'en tromper promeut vers le mauvais environnement, ou
# vers aucun. Le dashboard affiche `qualif` et écrit `testing`, via le champ
# dédié `promotion_suffix` (B13).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portal-testing
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portal
  filterTags:
    pattern: '^(?P<semver>.+)_testing$'
    extract: '$semver'
  policy:
    semver:
      range: '>=0.0.0-0'
---
# preprod — accepte encore les pré-releases : la frontière RC / release finale se
# situe entre `preprod` et `prod`, et non avant.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portal-preprod
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portal
  filterTags:
    pattern: '^(?P<semver>.+)_preprod$'
    extract: '$semver'
  policy:
    semver:
      range: '>=0.0.0-0'
---
# prod — **sans `-0`**, et c'est ce qui protège la production.
#
# L'absence de composante de pré-release rend une RC structurellement inéligible.
# Mais le refus est silencieux : promouvoir une RC ici produirait un tag valide,
# poussé sans erreur, que Flux ignorerait. Le dashboard ne s'en remet donc pas à
# Flux pour refuser — il refuse en amont, sur `accepts_prerelease`, et vérifie au
# démarrage que ce champ concorde avec la plage ci-dessous.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portal-prod
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portal
  filterTags:
    pattern: '^(?P<semver>.+)_prod$'
    extract: '$semver'
  policy:
    semver:
      range: '>=0.0.0'
