# Image selection per environment — a local reproduction of what Flux carries in production.
#
# These objects are not decorative: they are what the dashboard reads at start-up in order to
# check that its `environments` table says the same thing as Flux. A divergence between the two
# is exactly what produces a promotion with no effect, and therefore blocks the start-up.
#
# No controller runs: `status.latestImage` stays empty until the simulator fills it in.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: portal
  namespace: flux-system
spec:
  # `reg.cadoles.com/vcarroy` remplace `cnous-mse` en local (doc 11 §11.4).
  image: reg.cadoles.com/vcarroy/portal
  interval: 5m
---
# unstable — accepts pre-releases.
#
# The range's `-0` suffix is no detail: a SemVer range with no pre-release component selects
# none. `>=0.0.0` would silently ignore every RC promoted to this environment.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portal-unstable
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portal
  # `1.8.0-rc1_unstable` is not valid SemVer: the version part must be extracted before the
  # ordering applies. The underscore comes from the grammar of OCI tags, which excludes the `+`
  # of SemVer metadata.
  filterTags:
    pattern: '^(?P<semver>.+)_unstable$'
    extract: '$semver'
  policy:
    semver:
      range: '>=0.0.0-0'
---
# qualif — **the Flux suffix is `testing`**, not `qualif`.
#
# It is not a reading alias for compatibility: it is the value used to build the tag pushed.
# Getting it wrong promotes to the wrong environment, or to none. The dashboard displays
# `qualif` and writes `testing`, through the dedicated `promotion_suffix` field.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portal-testing
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portal
  filterTags:
    pattern: '^(?P<semver>.+)_testing$'
    extract: '$semver'
  policy:
    semver:
      range: '>=0.0.0-0'
---
# preprod — still accepts pre-releases: the RC / final release boundary sits between `preprod`
# and `prod`, and not before.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portal-preprod
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portal
  filterTags:
    pattern: '^(?P<semver>.+)_preprod$'
    extract: '$semver'
  policy:
    semver:
      range: '>=0.0.0-0'
---
# prod — **without `-0`**, and that is what protects production.
#
# The absence of a pre-release component makes an RC structurally ineligible. But the refusal
# is silent: promoting an RC here would produce a valid tag, pushed with no error, which Flux
# would ignore. The dashboard therefore does not rely on Flux to refuse — it refuses upstream,
# on `accepts_prerelease`, and checks at start-up that this field agrees with the range below.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: portal-prod
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portal
  filterTags:
    pattern: '^(?P<semver>.+)_prod$'
    extract: '$semver'
  policy:
    semver:
      range: '>=0.0.0'
