# Git source and reconciliations per environment.
#
# The dashboard does not observe the deployment, it **deduces** it. Two of the three sources
# crossed go through these objects:
#
#   - the `GitRepository` and the commits the image-automation-controller writes there feed
#     `environment_observations.git_*`;
#   - the `Kustomization` — `Reconciling`, then `Ready` with `lastAppliedRevision` — feeds
#     `flux_state`.
#
# The third is the `PortalData` CRD, written by the application itself.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mse-kustom
  namespace: flux-system
spec:
  interval: 5m
  url: https://forge.cadoles.com/cnous-mse/mse-kustom
  ref:
    branch: unstable
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portal-unstable
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: mse-kustom
  path: ./overlays/unstable
  prune: true
  targetNamespace: mse-dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portal-testing
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: mse-kustom
  path: ./overlays/testing
  prune: true
  targetNamespace: mse-dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portal-preprod
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: mse-kustom
  path: ./overlays/preprod
  prune: true
  targetNamespace: mse-dev
---
# Production runs in an independent cluster, out of the dashboard's reach. This entry exists so
# that the interface can be exercised on the "not observable" case, distinct from "blocked" —
# the only way of checking that it tells them apart without having a second cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portal-prod
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: mse-kustom
  path: ./overlays/prod
  prune: true
  targetNamespace: mse-dev
---
# Writes into `mse-kustom` the tag each `ImagePolicy` kept. It is that rewriting which makes
# production partially observable with no access to its cluster: `mse-kustom` is on Gitea,
# already integrated, and can be read from outside.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: portal
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: mse-kustom
  git:
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@cadoles.com
      messageTemplate: "chore(image): mise à jour automatique"
    push:
      branch: unstable
