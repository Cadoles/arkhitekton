apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Objets Flux de développement, jamais déployés ailleurs. Ils reproduisent la
# *forme* de ce que porte la production, pas son comportement : aucun contrôleur
# ne tourne (doc 11 §11.3).
resources:
  - namespace.yaml
  - image-policies.yaml
  - kustomizations.yaml
