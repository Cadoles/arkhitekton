apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: arkhitekton

# Local development loop on kind.
#
# Skaffold replaces `make deploy`, and not only out of convenience: it fixes a fundamental
# defect of that target. The `dev` tag was mutable there, hence invisible to a node on
# `IfNotPresent`, and an explicit `kubectl rollout restart` was needed for the pods to take the
# image. Forgetting that restart gave a cluster running code seventeen commits old while
# displaying up-to-date manifests — a failure hard to see, since everything looks deployed.
#
# Skaffold tags by content digest: each build produces a different tag, and `IfNotPresent` can
# therefore no longer serve a stale image. The problem disappears by construction instead of
# being worked around.

build:
  # The local daemon, with no registry. Skaffold recognises a kind context and injects the image
  # into the nodes: the round trip through reg.cadoles.com would largely dominate the time of an
  # iteration.
  local:
    push: false
    useBuildkit: true

  artifacts:
    # The name must be the one the overlay produces, otherwise Skaffold would not recognise the
    # image to substitute in the rendered manifests.
    - image: reg.cadoles.com/vcarroy/arkhitekton
      docker:
        dockerfile: Dockerfile
        # The forge's credentials, mounted for the duration of `go mod download`. The dashboard depends
        # on a private module, fetched by a git clone: without them, the build fails on an
        # authentication error.
        #
        # A BuildKit secret leaves no trace in the image's layers, unlike a `COPY`, which would engrave
        # them there for good.
        secrets:
          - id: git-credentials
            src: ~/.git-credentials
        buildArgs:
          VERSION: dev-skaffold
          # Skaffold does not substitute shell commands in buildArgs: the exact revision stays `make
          # image`'s business, which serves to produce the published images. Here, only the iteration
          # counts.
          REVISION: developpement-local

manifests:
  kustomize:
    paths:
      - deploy/overlays/local

deploy:
  # A cluster guard rail: this configuration builds unpublished code and injects it into the
  # nodes. Restricting it to kind is what stops a `skaffold run` launched with the wrong context
  # reaching a real environment — a forced namespace would have protected nothing against that.
  kubeContext: kind-mse

  # The wait for readiness is explicit: without it, Skaffold would return before the schema was
  # applied, and the first calls would fail on missing tables.
  #
  # The delay covers the migration and the start-up of the probes, which check PostgreSQL, the
  # schema and MinIO before declaring a pod ready.
  statusCheck: true
  statusCheckDeadlineSeconds: 300

  kubectl:
    # No `defaultNamespace`: it would pass `--namespace` to kubectl, which then refuses any object
    # declaring another namespace. The overlay covers three — arkhitekton, mse-tekton-pipelines,
    # and one cluster-scoped object — because each manifest carries its own.
    #
    # It is the same reason that forbids a `namespace:` transformer in `deploy/base`: there it would
    # silently move the cross-namespace Role, here it fails the deployment. The second case is the
    # luckier one.
    hooks:
      before:
        # A Job's `spec.template` is immutable: reapplying a Job whose image has changed is refused by
        # the API. Deleting them first is what makes the deployment replayable — without which the
        # second iteration fails where the first succeeded.
        - host:
            command:
              - sh
              - -c
              - >-
                kubectl delete job -n arkhitekton
                arkhitekton-migrate arkhitekton-minio-bucket
                --ignore-not-found
            os: [linux, darwin]

portForward:
  # The interface is reachable with no ingress and no entry in /etc/hosts: a developer must be
  # able to look at the screen they are changing without configuring their machine's name
  # resolution.
  - resourceType: service
    # `arkhitekton-api`, and not `arkhitekton`: the name prefix comes from the base's `namePrefix`,
    # and an invented name would make the port-forward fail silently — curl answers 000, which looks
    # like a dead application.
    resourceName: arkhitekton-api
    namespace: arkhitekton
    port: 80
    localPort: 8080
