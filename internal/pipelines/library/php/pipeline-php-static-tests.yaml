apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: php-static-tests
spec:
  description: >
    Analyse statique de l'application — PHP-CS-Fixer et PHPStan.

    Les tests unitaires ont leur propre pipeline, `php-unit-tests` : « le code
    fait-il ce qu'on attend » et « le code est-il écrit proprement » sont deux
    questions, que le score pondère séparément. Les mêler donnait un seul
    verdict pour deux signaux, et un cs-fixer non conforme faisait échouer le
    même run que des tests verts.

  params:
    - name: repo-url
    - name: revision
    # URL PUT pré-signée des résultats, fournie par le dashboard. Vide, la
    # publication est ignorée : un run déclenché par webhook n'a personne pour lui
    # en délivrer une, et doit continuer de tourner.
    - name: results-upload-url
      default: ""

  workspaces:
    - name: shared-data
    - name: git-credentials

  tasks:
    - name: git-clone
      displayName: Clone mse
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-data
        - name: ssh-directory
          workspace: git-credentials
      params:
        - name: gitInitImage
          value: ghcr.io/tektoncd/github.com/tektoncd/pipeline/cmd/git-init:v0.29.0
        - name: submodules
          value: "false"
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)

    - name: composer-install
      displayName: Install composer dependencies
      runAfter: ["git-clone"]
      taskRef:
        name: composer-install
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: install-dev-dependencies
          value: "true"

    - name: run-cs-fixer
      displayName: Run cs-fixer
      runAfter: ["composer-install"]
      taskRef:
        name: cs-fixer
      workspaces:
        - name: source
          workspace: shared-data

    - name: run-phpstan
      displayName: Run phpstan
      runAfter: ["composer-install"]
      taskRef:
        name: phpstan
      workspaces:
        - name: source
          workspace: shared-data

  finally:
    # En `finally`, et non après chaque test : une violation PHPStan ou un test
    # unitaire en échec fait sortir sa task en erreur, ce qui empêchait jusqu'ici la
    # publication de s'exécuter. Les résultats étaient donc perdus exactement dans le
    # cas où ils sont utiles. Les trois familles écrivent sous `test-results/`, un
    # seul envoi suffit.
    - name: save-results
      displayName: Publish test results
      taskRef:
        name: publish-artifact
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: path
          value: test-results
        # Les trois familles écrivent sous `test-results/` et le nombre de fichiers
        # dépend de ce qui a tourné : une archive, sous une clé unique par run.
        - name: mode
          value: archive
        - name: upload-url
          value: $(params.results-upload-url)
