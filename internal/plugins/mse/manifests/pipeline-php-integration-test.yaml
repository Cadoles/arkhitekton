apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: php-integration-test
spec:
  params:
    # The results' presigned PUT URL, supplied by the dashboard. Empty, publication is skipped: a
    # run triggered by a CronJob has nobody to hand it one, and must go on running.
    - name: results-upload-url
      default: ""
    - name: mse-repo
    - name: mse-kustom-repo
    - name: mse-revision
    - name: mse-kustom-revision
    - name: overlay-location
    - name: reg-project
    # With no default, hence required: this pipeline deploys an image that is **already
    # published**, it no longer builds one.
    #
    # Rebuilding here produced an artifact different from the one the release published —
    # timestamps, layer order, and a tag derived from the branch rather than from the version. The
    # integration tests therefore bore on an image nobody will deliver: the re-tag principle,
    # applied to integration as it was to the audit.
    - name: image-tag
      description: Tag of the portal and portal-cli images to deploy.
    - name: consumer-image
      default: portal-cli
      description: >
        Name of the second image. `portal-cli` since the FrankenPHP migration — it
        serves the Messenger consumers, the cronjobs and the jobs. The parameter stays
        settable so that a test kustomization can name another one.
    - name: dev-image
      default: portal-dev
      description: >
        Name of the development image. `mse-kustom`'s `dev` and `pipeline` overlays
        run the bootstrap job on it: with no substitution, it would pull
        `portal-dev:latest` instead of the version under test, and the data set would
        be loaded by a version other than the one being exercised.
    - name: minio-host
    - name: minio-bucket
    - name: integration-debug
      default: "false"
    - name: integration-timeout
      default: 20m
    - name: immutable-delete-allowlist
      default: ""
    - name: apply-strategy
      default: "server-side-apply"

  workspaces:
    - name: mse
    - name: kustomization
    - name: git-credentials
    - name: dockerconfig

  tasks:
    - name: git-clone-mse
      displayName: Clone mse
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: mse
        - name: ssh-directory
          workspace: git-credentials
      params:
        - name: gitInitImage
          value: ghcr.io/tektoncd/github.com/tektoncd/pipeline/cmd/git-init:v0.29.0
        - name: submodules
          value: "false"
        - name: url
          value: $(params.mse-repo)
        - name: revision
          value: $(params.mse-revision)

    - name: git-clone-kustomization
      displayName: Clone mse kustom
      runAfter: ["git-clone-mse"]
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: kustomization
        - name: ssh-directory
          workspace: git-credentials
      params:
        - name: gitInitImage
          value: ghcr.io/tektoncd/github.com/tektoncd/pipeline/cmd/git-init:v0.29.0
        - name: submodules
          value: "false"
        - name: url
          value: $(params.mse-kustom-repo)
        - name: revision
          value: $(params.mse-kustom-revision)

    - name: deploy-mse-namespace
      displayName: Deploy mse
      runAfter: ["git-clone-kustomization"]
      taskRef:
        name: deploy-mse
      workspaces:
        - name: kustomization
          workspace: kustomization
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: namespace
          value: mse-pipeline
        - name: replace-image-mapping
          # The three images published by the build, at the same tag. An entry matching nothing in the
          # kustomization deployed is simply ignored: that is what allows keeping the complete list here,
          # whether the real portal is deployed or a test kustomization that uses only two of them.
          value: "{images: [
            {name: 'reg.cadoles.com/cnous-mse/portal', newName: '$(params.reg-project)/portal', newTag: '$(params.image-tag)'},
            {name: 'reg.cadoles.com/cnous-mse/$(params.consumer-image)', newName: '$(params.reg-project)/$(params.consumer-image)', newTag: '$(params.image-tag)'},
            {name: 'reg.cadoles.com/cnous-mse/$(params.dev-image)', newName: '$(params.reg-project)/$(params.dev-image)', newTag: '$(params.image-tag)'}
            ]}"
        - name: overlay-location
          value: $(params.overlay-location)
        - name: reset-data
          value: "true"
        - name: immutable-delete-allowlist
          value: $(params.immutable-delete-allowlist)
        - name: apply-strategy
          value: $(params.apply-strategy)

    - name: run-integration-tests
      displayName: Run integration tests
      runAfter: ["deploy-mse-namespace"]
      taskRef:
        name: integration-test
      workspaces:
        - name: source
          workspace: mse
      params:
        - name: namespace
          value: mse-pipeline
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
        - name: minio-host
          value: $(params.minio-host)
        - name: minio-bucket
          value: $(params.minio-bucket)
        - name: debug
          value: $(params.integration-debug)
        - name: timeout
          value: $(params.integration-timeout)

  finally:
    # In `finally`, and not after `run-integration-tests`: a failed test makes its task exit with
    # an error, and a publication following it would not run. The report would be lost exactly in
    # the case where it is useful. The same reason as in `php-static-tests`.
    - name: save-results
      displayName: Publish test results
      taskRef:
        name: publish-artifact
      workspaces:
        - name: source
          workspace: mse
      params:
        - name: path
          value: test-results
        # The whole directory, as an archive: the Task writes into `test-results/integration/` there,
        # and it is that path which names the family for the reader.
        - name: mode
          value: archive
        - name: upload-url
          value: $(params.results-upload-url)
