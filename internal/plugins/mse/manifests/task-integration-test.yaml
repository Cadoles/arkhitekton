apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: integration-test
spec:
  workspaces:
    - name: source
  results:
    - name: summary
      description: PHPUnit summary line (e.g. "OK (123 tests, 456 assertions)")
  params:
    - name: namespace
    - name: pipeline-run-name
      default: ""
      description: PipelineRun name, used to suffix the uploaded log object
    - name: deployment-name
      default: portal
    - name: container-name
      default: portal-php-fpm84
    - name: testsuite
      default: integration
    - name: debug
      default: "false"
    - name: rollout-timeout
      default: 300s
    - name: timeout
      default: 20m
    - name: retry-on-exit-137
      default: "true"
    - name: max-retries
      default: "1"
    - name: retry-delay-seconds
      default: "10"
    - name: minio-host
      default: ""
    - name: minio-bucket
      default: ""
    - name: minio-path
      default: /integration-tests/phpunit
    - name: junit-pod-path
      default: /tmp/junit-integration.xml
      description: >
        Path where PHPUnit writes its JUnit report in the application pod. Empty
        disables producing the report.
  steps:
    - name: integration-test
      image: reg.cadoles.com/cnous-mse/tekton-mse-manager:v1.1.1
      # The failure no longer stops the Task: the next step must run **above all** when this one
      # failed, since it is what says whether the tool concluded. The exit code is kept by Tekton and
      # the `report` step picks it up again — so the Task still fails when the tests fail.
      onError: continue
      command:
        - /usr/local/bin/tekton-mse-manager
      args:
        - integration-test
        - --namespace
        - $(params.namespace)
        - --deployment
        - $(params.deployment-name)
        - --container
        - $(params.container-name)
        - --testsuite
        - $(params.testsuite)
        - --debug=$(params.debug)
        - --rollout-timeout
        - $(params.rollout-timeout)
        - --timeout
        - $(params.timeout)
        - --retry-on-exit-137=$(params.retry-on-exit-137)
        - --max-retries
        - $(params.max-retries)
        - --retry-delay
        - $(params.retry-delay-seconds)s
        - --log-file
        - $(workspaces.source.path)/integration-tests-logs/phpunit.log
        # The JUnit report is produced in the application pod then brought back into the workspace: it
        # is what the dashboard parses for the test-by-test detail, the log staying meant for direct
        # reading.
        - --junit-pod-path
        - $(params.junit-pod-path)
        - --junit-file
        - $(workspaces.source.path)/test-results/integration/junit.xml
        - --summary-file
        - $(results.summary.path)
        - --pipeline-run-name
        - $(params.pipeline-run-name)
        - --minio-host
        - $(params.minio-host)
        - --minio-bucket
        - $(params.minio-bucket)
        - --minio-path
        - $(params.minio-path)
      env:
        - name: MINIO_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_USER
        - name: MINIO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_PASSWORD

    # The run descriptor, without which a tool that died before starting cannot be told from a
    # suite that passes: neither publishes any failure.
    #
    # A separate step, and not folded into the previous one: that one runs a compiled binary whose
    # shell is unknown, and wrapping it in a `script` would depend on an assumption that cannot be
    # checked here.
    - name: report
      image: reg.cadoles.com/dh/alpine/curl:8.17.0
      script: |
        #!/usr/bin/env sh
        set -u

        JUNIT="$(workspaces.source.path)/test-results/integration/junit.xml"
        RC=$(cat "$(steps.step-integration-test.exitCode.path)" 2>/dev/null || echo 1)

        # The report is authoritative, and not the exit code: PHPUnit exits with a failure as soon as a
        # test fails, which is a **success** of the tool. What tells a tool that did not conclude is the
        # absence of a report. The same rule as `unit-test`, so that the two families read alike.
        if [ -s "${JUNIT}" ]; then
          STATUS=ok
        else
          STATUS=error
        fi

        SUMMARY=$(cat "$(results.summary.path)" 2>/dev/null || true)
        if [ -z "${SUMMARY}" ]; then
          SUMMARY="aucun rapport JUnit produit"
        fi

        # `phpunit-integration` and not `phpunit`: it is the name under which the artifact ingestion
        # files this report. Two names would make the same tool appear twice on a release's screen,
        # conforming under one and never measured under the other.
        printf '##MSE-META## {"tool":"phpunit-integration","scanner":"integration","format":"junit-xml","output":"junit.xml","exit_code":%d,"status":"%s"}\n' \
          "${RC}" "${STATUS}"
        printf '##MSE-SUMMARY## %s\n' "${SUMMARY}"

        # The previous step's exit code is returned as it is: without that, `onError: continue` would
        # turn every test failure into a success.
        exit "${RC}"
