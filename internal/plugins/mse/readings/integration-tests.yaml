# PHPUnit's JUnit report, from inside a deployed MSE. When the tests leave no report, saying they
# did not conclude is what tells a failed deployment from a clean run.
apiVersion: arkhitekton.reading/v1
tools:
  - tool: phpunit-integration
    task: run-integration-tests
    group: integration
    summary: tests
    duration: "{duration_ms}"
    cases:
      # The class name names the suite, else the suite path: renaming a file must not break a
      # test's identity.
      - from: junit.cases
        suite: "{classname | or: path}"
        name: "{name}"
        duration: "{duration_ms}"
        message: "{detail | firstline}"
        trace: "{trace | trim}"
        status:
          from: outcome
          # A case that passed on a retry is flaky, not failed.
          map: { passed: passed, failed: failed, errored: failed, rerun: flaky, skipped: skipped }
