# A project's pull requests, followed from its forge, and a pull request's page: what runs on its
# head and what the results say, as for a release.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: pulls }
spec:
  path: pulls
  parent: shell
  blocks:
    - { id: core.list, component: core/pulls }
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: pull }
spec:
  path: pulls/:number
  parent: shell
  blocks:
    - { id: core.page, component: core/pull }
