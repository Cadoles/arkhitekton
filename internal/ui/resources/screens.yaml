# The core's screens. A screen frames its children (parent): the shell frames them all, and the
# executions, administration and project screens frame their tabs. Each is one block for now, the
# screen's component; a plugin adds blocks next to them, under its prefix.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: home }
spec:
  parent: shell
  blocks: [{ id: core.home, component: core/home-redirect }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: versions }
spec:
  path: versions
  parent: shell
  blocks: [{ id: core.versions, component: core/versions }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: version }
spec:
  path: versions/:id
  parent: shell
  blocks: [{ id: core.version, component: core/version }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: release-notes }
spec:
  path: releases/:tag/notes
  parent: shell
  blocks:
    - id: core.notes
      component: core/placeholder
      props:
        lot: lot 6
        title: Note de release
        summary: Note générée puis éditable, avec la date et l'auteur de la dernière modification.
        params: [tag]
---
# The three execution views under one frame: what runs, what waits, and what governs the wait.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: executions }
spec:
  path: runs
  parent: shell
  blocks: [{ id: core.executions, component: core/executions-layout }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: runs }
spec:
  parent: executions
  blocks: [{ id: core.runs, component: core/runs }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: queue }
spec:
  path: queue
  parent: executions
  blocks: [{ id: core.queue, component: core/queue }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: events }
spec:
  path: events
  parent: executions
  blocks: [{ id: core.events, component: core/events }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: plan-runs }
spec:
  path: automations
  parent: executions
  blocks: [{ id: core.plan-runs, component: core/plan-runs }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: queue-settings }
spec:
  path: settings
  parent: executions
  blocks: [{ id: core.queue-settings, component: core/queue-settings }]
---
# Outside the frame: a run's detail is not a fourth view. The static segment wins over the
# parameter, so /runs/queue does not look for a run of that name.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: run }
spec:
  path: runs/:name
  parent: shell
  blocks: [{ id: core.run, component: core/run }]
---
# The queue's former address, kept for links already shared.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: queue-former }
spec:
  path: queue
  parent: shell
  redirect: /runs/queue
