# The core's screens. A screen frames its children (parent): the shell frames them all, and the
# executions, administration and project screens frame their tabs. Each is one block for now, the
# screen's component; a plugin adds blocks next to them, under its prefix.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: home }
spec:
  parent: shell
  blocks: [{ id: core.home, component: core/home-redirect }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: versions }
spec:
  path: versions
  parent: shell
  blocks: [{ id: core.versions, component: core/versions }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: version }
spec:
  path: versions/:id
  parent: shell
  blocks: [{ id: core.version, component: core/version }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: release-notes }
spec:
  path: releases/:tag/notes
  parent: shell
  blocks:
    - id: core.notes
      component: core/placeholder
      props:
        lot: lot 6
        title: Note de release
        summary: Note générée puis éditable, avec la date et l'auteur de la dernière modification.
        params: [tag]
---
# The execution views under one frame: what runs, what waits, the facts observed, what they
# triggered, and what governs it all. Three ways of looking at what the dashboard did: separated,
# bringing a fact next to the run that produced it would take navigating.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: executions }
spec:
  path: runs
  parent: shell
  blocks:
    - { id: core.tabs, widget: { tabs: { navigation: executions, label: Vues d'exécution } } }
    - { id: core.outlet, widget: { outlet: {} } }
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: runs }
spec:
  parent: executions
  blocks: [{ id: core.runs, component: core/runs }]
---
# The statistics' former address, kept for links already shared.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: stats-former }
spec:
  path: stats
  parent: shell
  redirect: /admin/stats
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: queue }
spec:
  path: queue
  parent: executions
  blocks: [{ id: core.queue, component: core/queue }]
---
# What automations did is read in the journal, under the event that set them off: the former tab
# leads there, filtered.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: plan-runs-former }
spec:
  path: automations
  parent: executions
  redirect: /admin/journal?nature=automation
---
# Outside the frame: a run's detail is not a third view. The static segment wins over the
# parameter, so /runs/queue does not look for a run of that name.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: run }
spec:
  path: runs/:name
  parent: shell
  blocks: [{ id: core.run, component: core/run }]
---
# The queue's former address, kept for links already shared.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: queue-former }
spec:
  path: queue
  parent: shell
  redirect: /runs/queue
---
# The administration under one frame: projects, the instance's plugins and capabilities, roles,
# the journal. They have neither the same reader nor the same frequency, and stacked they made a
# page one scrolled through instead of reading. What belongs to one project lives on its page.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin }
spec:
  path: admin
  parent: shell
  blocks:
    - { id: core.title, widget: { heading: { text: Administration } } }
    - { id: core.tabs, widget: { tabs: { navigation: admin, label: Vues d'administration } } }
    - { id: core.outlet, widget: { outlet: {} } }
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-projects }
spec:
  parent: admin
  blocks: [{ id: core.projects, component: core/projects }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-plugins }
spec:
  path: plugins
  parent: admin
  blocks: [{ id: core.plugins, component: core/plugins }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-capabilities }
spec:
  path: pipelines
  parent: admin
  blocks: [{ id: core.capabilities, component: core/capabilities }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-users }
spec:
  path: users
  parent: admin
  blocks: [{ id: core.users, component: core/users }]
---
# Kept: the projects tab lived at this address, and shared links do not correct themselves.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-projects-former }
spec:
  path: projects
  parent: admin
  blocks: [{ id: core.projects, component: core/projects }]
---
# What is delivered, for the operators of a project.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-stats }
spec:
  path: stats
  parent: admin
  permission: pipeline:run
  blocks: [{ id: core.stats, component: core/stats }]
---
# What happened in the application: actions and events in one feed.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-journal }
spec:
  path: journal
  parent: admin
  blocks: [{ id: core.journal, component: core/journal }]
---
# The AI agents each person authorised, to connect one and to revoke one; an administrator sees
# everyone's.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-agents }
spec:
  path: agents
  parent: admin
  blocks: [{ id: core.agents, component: core/agents }]
---
# An AI agent asks to act on behalf of the person signed in.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: agent-consent }
spec:
  path: connect/:request
  parent: shell
  blocks: [{ id: core.agent-consent, component: core/agent-consent }]
---
# The addresses of the audit log and of a project's facts, kept for links already shared: both
# are read in the journal now.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-logs-former }
spec:
  path: admin/logs
  parent: shell
  redirect: /admin/journal
---
# The pipelines' former addresses: their binding and weight were under Capacités, their queues'
# ceilings under Exécutions, Paramètres.
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: admin-capabilities-former }
spec:
  path: admin/capabilities
  parent: shell
  redirect: /admin/pipelines
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: queue-settings-former }
spec:
  path: runs/settings
  parent: shell
  redirect: /admin/pipelines
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: events-former }
spec:
  path: runs/events
  parent: shell
  redirect: /admin/journal
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: project }
spec:
  path: projects/:slug
  parent: admin
  blocks: [{ id: core.project, component: core/project-layout }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: project-general }
spec:
  parent: project
  blocks: [{ id: core.general, component: core/project-general }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: project-plugins }
spec:
  path: plugins
  parent: project
  blocks: [{ id: core.plugins, component: core/project-plugins }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: project-pipelines }
spec:
  path: pipelines
  parent: project
  blocks: [{ id: core.pipelines, component: core/project-pipelines }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: project-automations }
spec:
  path: automations
  parent: project
  blocks: [{ id: core.automations, component: core/project-automations }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: project-sync }
spec:
  path: sync
  parent: project
  blocks: [{ id: core.sync, component: core/project-sync }]
---
apiVersion: ui.arkhitekton/v1
kind: Screen
metadata: { name: not-found }
spec:
  path: "*"
  parent: shell
  blocks: [{ id: core.not-found, component: core/not-found }]
