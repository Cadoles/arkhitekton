name: Continuous integration

# Checks and release live in the same file for a single reason: the release must be able to
# depend on the checks. Two separate workflows cannot wait for each other, and a tag would then
# put an image on the registry with no test having run.
#
# The trigger follows `mse-tekton`'s convention: the integration branches and the pull requests,
# not every branch pushed. Covering `**` would double every run as soon as a PR is opened.
on:
  push:
    # `dashboard` is the project's working branch as long as no merge has happened.
    branches: [main, master, develop, dashboard]
    tags: ["v*"]
  pull_request:

env:
  # The latest patch of the line the image builds with (`golang:1.26-alpine`), not go.mod's
  # minimum: govulncheck judges the standard library of the toolchain that runs it, and a release
  # is compiled with it.
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  KUSTOMIZE_VERSION: "5.8.1"
  KUSTOMIZE_SHA256: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
  KUBE_LINTER_VERSION: "0.8.3"
  KUBE_LINTER_SHA256: "1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df"
  BUILDKIT_IMAGE: moby/buildkit:v0.23.2
  IMAGE: reg.cadoles.com/vcarroy/arkhitekton
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  go:
    name: Formatting, static analysis and tests
    runs-on: ubuntu-latest

    # PostgreSQL and MinIO are real: applying a schema, SigV4 signing and reading by range are not
    # usefully simulated.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: t3st
          POSTGRES_DB: mse
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d mse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      minio:
        # The image `make test-integration` runs. MinIO no longer publishes its own, and this one
        # has no default command: `cmd` is a Gitea extension GitHub Actions does not have.
        image: cgr.dev/chainguard/minio:latest
        cmd: ["server", "/data"]
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin

    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Formatting and static analysis
        run: make lint

      # `services` guarantees that the container runs, not that the server accepts requests, and
      # the image has no probe to declare.
      - name: Wait for MinIO
        run: |
          set -eu
          for _ in $(seq 1 60); do
            if curl -sf http://minio:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not answer within 60 s" >&2
          exit 1

      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://postgres:t3st@postgres:5432/mse?sslmode=disable
          TEST_MINIO_ENDPOINT: minio:9000
          TEST_MINIO_BUCKET: arkhitekton-test
        run: make test-ci

  vuln:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: govulncheck
        run: make vuln

  web:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the dependencies
        run: make web-install

      - name: Types, static analysis and tests
        run: make web-check

      - name: Build
        run: make web

  manifests:
    name: Manifests rendering and analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Install kustomize and kube-linter
        run: |
          set -eu
          cd /tmp

          curl -sSLo kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tgz" | sha256sum -c -
          tar xzf kustomize.tgz kustomize

          curl -sSLo kube-linter.tgz \
            "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          echo "${KUBE_LINTER_SHA256}  kube-linter.tgz" | sha256sum -c -
          tar xzf kube-linter.tgz kube-linter

          mkdir -p "${HOME}/.local/bin"
          install -m 0755 kustomize kube-linter "${HOME}/.local/bin/"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # The local overlay reads files that are not versioned: the environment and the pipelines'
      # credentials. Placeholders are enough to render and analyse, and none enters a rule checked.
      - name: Placeholders for the unversioned files
        run: |
          set -eu
          cp deploy/overlays/local/secrets/dashboard.env.example \
             deploy/overlays/local/secrets/dashboard.env
          credentials=deploy/overlays/local/components/pipeline-credentials
          touch "${credentials}/pipeline-ssh-key" "${credentials}/pipeline-known-hosts"
          echo '{"auths":{}}' > "${credentials}/pipeline-dockerconfig.json"

      - name: Render and analyse
        run: make manifests

  image:
    name: Image build
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # Built without being pushed, for the runner's platform only: the point is to see a broken
      # Dockerfile before a release does.
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}

  release:
    name: Release
    # On a version tag only, and only after every check: a version is a named object whose tests
    # ran, never a branch's state.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [go, vuln, web, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4
        with:
          # The notes list the commits since the previous version tag.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build the binaries
        run: |
          make web-install
          make binaries RELEASE_VERSION="${GITHUB_REF_NAME}" RELEASE_REVISION="${GITHUB_SHA}"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: reg.cadoles.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Derive the tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            # The moving tags follow final versions only: a candidate become `latest` would be
            # delivered where a stable version was expected.
            if [[ "${version}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "${IMAGE}:v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              echo "${IMAGE}:v${BASH_REMATCH[1]}"
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      # The build stages cross-compile on the runner's platform: no emulator is needed.
      - name: Build and publish the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      - name: Write the notes
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eu
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${previous:+${previous}..}${GITHUB_REF_NAME}"
          {
            echo "Image: \`${IMAGE}:${GITHUB_REF_NAME}\` (${IMAGE_PLATFORMS})"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "## Changes${previous:+ since ${previous}}"
            echo
            git log --no-merges --format='- %s (%h)' "${range}"
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      # Last, so that a release on the forge always has its image. Replayed, it updates the
      # release and replaces its files.
      - name: Publish the release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ steps.tags.outputs.prerelease }}
          files: |
            dist/arkhitekton-linux-*
            dist/SHA256SUMS
