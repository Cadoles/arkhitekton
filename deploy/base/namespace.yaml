# A dedicated namespace, distinct from `mse-tekton-pipelines`.
#
# The separation is not cosmetic: it makes the dashboard's service account foreign to the
# pipelines' namespace, hence subject to an explicit Role describing exactly what it is allowed
# to do there (see rbac-tekton.yaml). Colocating the two would by default give the dashboard the
# neighbourhood of Tekton's secrets.
apiVersion: v1
kind: Namespace
metadata:
  name: arkhitekton
  labels:
    app.kubernetes.io/name: arkhitekton
    # The dashboard needs no privilege: the strictest profile of the Pod Security Standards applies
    # as it is, and setting it here makes any later manifest that departs from it fail at admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
