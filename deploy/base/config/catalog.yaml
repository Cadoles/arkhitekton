# Catalogue des pipelines lançables depuis le dashboard.
#
# Ce fichier vit hors du binaire, en ConfigMap, et il est validé au démarrage du
# `worker` contre les Pipeline réellement déployés : Pipeline absent, paramètre
# qu'il n'accepte pas, paramètre requis non couvert, workspace non lié — chacun
# empêche le démarrage avec un message qui le nomme (doc 06 §6.2). Y ajouter un
# pipeline ne demande aucune modification du code.
#
# Les valeurs sont relevées sur des PipelineRun réels du cluster, et non
# inventées : le catalogue doit reproduire ce que faisaient les TriggerTemplate
# de `mse-tekton`.

# Environnements de déploiement, dans leur ordre de promotion.
#
# Le `promotionSuffix` est la métadonnée que Flux attend dans le tag, et il est
# vérifié au démarrage contre les ImagePolicy réelles : une erreur ici ne produit
# aucun échec visible — le tag est poussé, Flux l'ignore, et la promotion paraît
# réussie (B7).
#
# Noter `qualif` → `testing` : Flux connaît cet environnement sous son ancien nom.
# C'est une correspondance de **sortie**, employée pour construire un tag.
#
# Les réglages sous `deployer:` appartiennent à l'outil de déploiement et à lui
# seul. Le dashboard les transporte sans les lire — c'est le déployeur qui les
# nomme et les valide (doc 12 §12.9, lot D). Ils étaient auparavant trois champs
# du catalogue, ce qui imposait le vocabulaire de Flux à tout projet, y compris à
# ceux qui n'ont aucun outil de déploiement.
#
# Les valeurs sont des chaînes, y compris les booléens : c'est ce qu'une
# configuration transporte, et le déployeur les interprète.
projects:
  # Chaque projet déclare ses environnements (doc 16 §16.18). Un projet qui a
  # le module MSE sans section ici n'a ni promotion ni observation.
  mse-test-project:
    environments:
      - id: unstable
        label: Unstable
        rank: 1
        namespace: mse-dev
        sensitive: false
        deployer:
          promotionSuffix: unstable
          acceptsPrerelease: "true"
          kustomization: portal-unstable

      - id: qualif
        label: Qualification
        rank: 2
        namespace: mse-dev
        sensitive: false
        deployer:
          promotionSuffix: testing
          acceptsPrerelease: "true"
          kustomization: portal-testing

      - id: preprod
        label: Pré-production
        rank: 3
        namespace: mse-dev
        # Reçoit ce qui part chez l'utilisateur final : promotion réservée au rôle
        # releaser. Un environnement sans `sensitive` est traité comme sensible.
        sensitive: true
        deployer:
          # Les RC vont jusqu'en pré-production ; la frontière RC / release finale
          # se situe entre preprod et prod, et non avant.
          promotionSuffix: preprod
          acceptsPrerelease: "true"
          kustomization: portal-preprod

      - id: prod
        label: Production
        rank: 4
        namespace: mse-prod
        sensitive: true
        deployer:
          promotionSuffix: prod
          # Sans pré-releases : la plage SemVer de sa politique s'écrit sans `-0`,
          # ce qui rend une RC structurellement inéligible.
          acceptsPrerelease: "false"
          kustomization: portal-prod
        # Cluster indépendant : ni PortalData, ni Deployment, ni statut Flux n'y sont
        # lisibles. L'interface l'affiche « non observable », état distinct de
        # « inconnu » (B8).
        observable: false

# Plafond global, toutes files confondues. Les pipelines demandent des PVC et des
# pods de build, et rien n'empêche mécaniquement d'en lancer vingt.
#
# Il prime sur les plafonds par type et n'est pas leur somme : sept files à cinq
# places en autoriseraient trente-cinq. Il est en revanche assez haut pour que les
# files respirent — le fixer à quatre rendrait le plafond par type décoratif,
# puisque aucun type n'atteindrait jamais le sien.
maxConcurrentRuns: 10

# Secret de tirage appliqué à tous les pipelines.
#
# Les cinq tirent au moins une image de `reg.cadoles.com` — `crane` pour pousser,
# `mktools` pour dériver un tag, `tekton-mse-manager` pour déployer — et le projet
# est privé. Sans ce réglage, les runs échouaient en `TaskRunImagePullFailed`,
# avant même d'atteindre l'étape qu'on croyait fautive.
#
# Global et non répété par entrée : le répéter l'aurait fait oublier sur la
# prochaine. Une entrée qui déclare son propre `podTemplate` l'emporte.
#
# Distinct du dockerconfig monté en workspace : celui-ci sert au **pod** à tirer
# son outillage depuis `cnous-mse`, celui-là sert à `crane` pour **pousser** les
# images produites. Deux gestes, deux portées, potentiellement deux comptes.
podTemplate:
  imagePullSecretsConfigKey: pipeline.imagePullSecret

pipelines:
  # L'audit de sécurité n'exige aucun paramètre : le pipeline porte ses propres
  # valeurs par défaut. C'est le kind le plus simple, et le seul lançable sans
  # rien saisir.
  - kind: security-audit
    # Enchaîné après une construction réussie, et relançable seul depuis l'écran
    # d'une release. Décidé ici et non en Go : c'est ce que **ce déploiement**
    # vérifie, et un projet sans audit de sécurité le retire sans recompiler.
    verification: true
    pipelineRef: security-audit
    label: Audit de sécurité
    # Aucune contention : un audit peut tourner pendant des tests E2E.
    timeout: 90m
    # Sans ces paramètres, les défauts du pipeline s'appliquaient : il scannait
    # `CNOUS/mse` à la révision `k8s-unstable`, quel que soit ce que le dashboard
    # croyait auditer. Un audit qui porte sur autre chose que la release est pire
    # qu'un audit absent — il rend un verdict qu'on rapporte à la mauvaise chose.
    params:
      app-repo-url:        { source: config, key: project.repoUrl }
      app-revision: { source: input,  required: true, suggest: git-ref }
      # L'audit scanne aussi l'infrastructure de déploiement et lit ses règles
      # Semgrep dans `mse-tekton` : trois dépôts, trois accès à accorder à la clé
      # de déploiement des pipelines.
      mse-kustom-repo-url: { source: config, key: forge.mseKustom.repoUrl }
      # La branche, elle aussi, doit venir de la configuration. Le défaut du
      # pipeline est `unstable`, la convention de `CNOUS/mse-kustom` ; un dépôt
      # qui ne la porte pas faisait échouer le clone — donc l'audit entier —
      # sur « couldn't find remote ref unstable ».
      mse-kustom-revision: { source: config, key: forge.mseKustom.revision }
      tekton-repo-url:     { source: config, key: forge.tekton.repoUrl }
      # L'audit ne construit plus : il analyse les images **déjà publiées** par
      # la construction de la release. Scanner une reconstruction rendrait un
      # verdict sur un artefact qu'on ne livre pas (B17).
      # `image` dit la nature, `image` (le champ) dit laquelle : c'est ici, et non
      # dans le code du dashboard, qu'un paramètre est rattaché à un dépôt publié.
      # La correspondance vivait en Go, sous forme d'un `case "portal-image"`, et
      # un pipeline nommant autrement ses paramètres ne pouvait pas la réemployer.
      portal-image:
        { source: input, required: true, suggest: image, image: portal }
      consumer-image:
        { source: input, required: true, suggest: image, image: portal-cli }
      minio-host:          { source: config, key: minio.host }
      minio-bucket:        { source: config, key: minio.pipelineBucket }
    # Le rapport normalisé, publié vers le dashboard par URL pré-signée.
    #
    # Sans cette déclaration, l'audit ne publiait que dans le bucket des
    # pipelines, où le dashboard ne lit pas : ses constats n'atteignaient jamais
    # l'écran de sécurité, et le signal `security` restait éternellement non
    # mesuré alors que dix scanners avaient tourné.
    #
    # Deux fichiers plutôt qu'une archive : l'ingesteur les reconnaît à leur nom
    # sous `raw/<run>/`, sans rien déballer.
    uploads:
      summary:
        param: summary-upload-url
        artifact: summary.json
        family: security
        format: file
      findings:
        param: findings-upload-url
        artifact: findings.jsonl
        family: security
        format: file
    # Les noms diffèrent de ceux des autres pipelines — `shared` et
    # `docker-config`, non `shared-data` et `dockerconfig`. Rien ne le devinerait :
    # c'est la validation contre le cluster qui les impose.
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: docker-config
        secret: { configKey: pipeline.registrySecret }
      - name: shared
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 2Gi

  # La promotion : un re-tag du même digest, jamais une reconstruction. C'est le
  # seul kind que le dashboard lance pour déployer, et il ne déploie pas
  # lui-même — Flux constate le nouveau tag et décide (B7).
  # Construction des images d'une pré-release.
  #
  # C'est le chaînon qui manquait entre « créer une release » et « une image
  # existe » : sans cette entrée, une pré-release naissait `draft` et y restait
  # indéfiniment, alors que le pipeline `build-image` existait dans le cluster.
  #
  # `version` porte le tag SemVer et prime sur `tag-name` : la Task
  # `generate-image-tag` s'en sert tel quel plutôt que de le dériver de la
  # branche, et le même tag part en `--build-arg VERSION` pour être inscrit dans
  # `/app/version.txt`. C'est ce qui rend l'image identifiable par ce qu'elle
  # rapporte d'elle-même, et donc l'invariant de version vérifiable (B17, P10).
  # Une exécution, une image. Le pipeline portait les trois cibles du Dockerfile
  # en dur ; il en prend désormais une en paramètre, et le dashboard lance autant
  # d'exécutions que d'images à produire. Chacune apparaît, échoue et se relance
  # séparément — un `portal-dev` en échec ne fait plus perdre le portail déjà
  # construit.
  - kind: build
    pipelineRef: build-image
    label: Construction d'image
    # Ce que ce pipeline laisse derrière lui. Le dashboard en lit les digests et
    # les rattache à la release ; un re-tag pourra les reprendre bit à bit.
    produces: [image]
    # `parallel` : deux constructions de versions différentes ne se gênent pas,
    # elles écrivent sous des tags distincts. La sérialisation du registre ne
    # concerne que le re-tag, où deux manifestes visent le même dépôt.
    params:
      repo-url:    { source: config, key: project.repoUrl }
      reg-project: { source: config, key: registry.project }
      # Le Dockerfile et son contexte viennent de la **déclaration du projet**, et
      # non de la configuration du déploiement. Un dépôt peut porter un
      # Dockerfile par image — `Dockerfile.dev` et `Dockerfile.prod` à sa racine —
      # plutôt qu'un seul à étapes, et la configuration ne saurait en nommer
      # qu'un. Le dashboard les renseigne par image (doc 12 §12.9, lot B).
      #
      # Facultatifs : un pipeline lancé à la main hors dashboard retombe sur les
      # valeurs par défaut de la Task, qui restent celles d'un dépôt ordinaire.
      #
      # Libellé, aide et exemple : ces quatre paramètres se **saisissent** depuis
      # l'onglet automatisation, et un champ nommé `image-name` sans explication
      # est un champ qu'on remplit de travers (doc 15 §15.5).
      dockerfile:
        source: input
        label: Dockerfile
        help: >-
          Chemin du fichier qui construit cette image, depuis la racine du dépôt.
          Vide : celui du projet.
        placeholder: ./Dockerfile
      context:
        source: input
        label: Contexte de construction
        help: Répertoire envoyé au moteur de build. Presque toujours la racine.
        placeholder: "."
      # La référence Git à construire — branche, tag ou commit, choisie à la
      # création de la release.
      revision: { source: input, required: true, suggest: git-ref }
      # Le tag SemVer. Requis : le laisser vide ferait retomber la Task sur la
      # dérivation par branche, et l'image porterait un tag sans rapport avec la
      # release qui l'a demandée.
      version: { source: input, required: true, suggest: release-tag }
      # Repli de nommage de la Task quand `version` est vide. Transmis pour que
      # le pipeline reste utilisable tel quel hors dashboard.
      tag-name: { source: input, required: true, suggest: release-tag }
      # Le dépôt publié et la cible du Dockerfile qui l'alimente. Deux paramètres
      # et non un : la correspondance appartient à l'appelant, et une cible
      # renommée ne doit pas obliger à renommer un dépôt du registre.
      image-name:
        source: input
        required: true
        suggest: image-name
        label: Dépôt publié
        help: >-
          Nom court du dépôt d'image, sans le registre ni le tag. C'est aussi le
          nom sous lequel les étapes suivantes désigneront ce qu'il produit.
        placeholder: portal
      target:
        source: input
        required: true
        suggest: build-target
        label: Cible du Dockerfile
        help: >-
          Étape `AS <nom>` qui produit cette image. Sur un Dockerfile sans
          étapes, la dernière.
        placeholder: web
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: dockerconfig
        secret: { configKey: pipeline.registrySecret }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 2Gi

  # Re-tag, et non « promotion » : le pipeline ne promeut rien, il pose un tag
  # supplémentaire sur un digest existant. C'est Flux qui déploie, en constatant
  # ce tag (B7). Et le dashboard s'en sert aussi hors promotion — donner à une
  # release finale son propre tag depuis celui de sa pré-release source —, où le
  # mot « promotion » induisait franchement en erreur.
  - kind: retag
    pipelineRef: retag-image
    label: Re-tag d'image
    # Une image, comme `build` — et c'est ce que le drapeau `verification` ne
    # savait pas dire : il n'avait que deux valeurs pour trois situations, et
    # `retag` tombait dans la même case qu'un pipeline qui ne produit rien.
    produces: [image]
    # Le registre supporte mal deux re-tags simultanés sur le même dépôt : les
    # sérialiser coûte quelques secondes et évite des manifestes concurrents.
    maxConcurrent: 1
    params:
      reg-project: { source: config, key: registry.project }
      image-name: { source: input, required: true, suggest: image-name }
      old-tag: { source: input, required: true, suggest: release-tag }
      new-tag: { source: input, required: true, suggest: release-tag }
    workspaces:
      # Ni dépôt cloné, ni fichier échangé : le re-tag ne manipule que des
      # manifestes. Le workspace `git-credentials` qu'il montait n'a jamais servi.
      - name: dockerconfig
        secret: { configKey: pipeline.registrySecret }

  # Analyse statique — PHP-CS-Fixer et PHPStan.
  #
  # Distincte des tests unitaires depuis qu'ils ont leur pipeline : « le code
  # fait-il ce qu'on attend » et « le code est-il écrit proprement » sont deux
  # questions, que le score pondère séparément. Les mêler donnait un seul verdict
  # pour deux signaux, et un cs-fixer non conforme faisait échouer le même run
  # que des tests verts — donc une relance qui rejouait les deux.
  - kind: static-tests
    verification: true
    pipelineRef: php-static-tests
    label: Analyse statique
    params:
      repo-url:     { source: config, key: project.repoUrl }
      revision: { source: input, required: true, suggest: git-ref }
    # Artefacts attendus. Le dashboard calcule la clé de chacun et mint l'URL
    # d'écriture **avant** de créer le run : le pipeline n'a donc ni bucket, ni
    # préfixe, ni identifiants MinIO, et le lecteur n'a rien à chercher par
    # préfixe ensuite (B14).
    uploads:
      results:
        param: results-upload-url
        # PHPStan et cs-fixer écrivent chacun sous `test-results/<outil>/` : une
        # archive, sous une clé unique par run. C'est le répertoire qui nomme la
        # famille au lecteur.
        artifact: static-tests.tar.gz
        family: static
        format: archive
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi

  - kind: unit-tests
    verification: true
    pipelineRef: php-unit-tests
    label: Tests unitaires
    params:
      repo-url:     { source: config, key: project.repoUrl }
      revision: { source: input, required: true, suggest: git-ref }
    uploads:
      results:
        param: results-upload-url
        artifact: unit-tests.tar.gz
        family: unit
        format: archive
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi

  - kind: e2e-tests
    pipelineRef: e2e-test
    label: Tests E2E
    # La ligne qui a motivé cette déclaration. Trois artefacts publiés, et
    # `verification: false` — non parce qu'elle ne produirait pas de résultats,
    # mais parce que le drapeau parlait d'**enchaînement** : une campagne E2E
    # vise un environnement partagé et ne part pas d'office après un build.
    #
    # Les deux axes sont désormais nommés séparément. Ses rapports sont lus, et
    # elle reste lancée à la demande.
    produces: [results]
    # Une campagne E2E s'exécute contre un environnement partagé : deux
    # exécutions simultanées se fausseraient mutuellement.
    # Une seule à la fois : elle déploie ou mesure une cible unique, et deux
    # exécutions simultanées se marcheraient dessus.
    maxConcurrent: 1
    timeout: 60m
    params:
      repo-url:     { source: config, key: forge.e2e.repoUrl }
      revision: { source: input, required: true, suggest: git-ref }
      environment: { source: input, required: true, suggest: environment }
    # Trois artefacts distincts, trois URLs. Les noms de fichiers produits par
    # Cypress dépendent des specs exécutées : personne ne peut les pré-signer un
    # par un, et chaque répertoire part donc en une archive.
    uploads:
      reports:
        param: reports-upload-url
        artifact: e2e-reports.tar.gz
        family: e2e
        format: archive
      videos:
        param: videos-upload-url
        artifact: e2e-videos.tar.gz
        family: e2e
        format: archive
      screenshots:
        param: screenshots-upload-url
        artifact: e2e-screenshots.tar.gz
        family: e2e
        format: archive
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi

  - kind: integration-tests
    verification: true
    pipelineRef: php-integration-test
    label: Tests d'intégration
    # Le pipeline déploie dans un namespace applicatif : deux exécutions
    # simultanées partageraient la même cible.
    # Une seule à la fois : elle déploie ou mesure une cible unique, et deux
    # exécutions simultanées se marcheraient dessus.
    maxConcurrent: 1
    serviceAccountName: tekton-kubectl
    timeout: 45m
    params:
      mse-repo:            { source: config, key: project.repoUrl }
      mse-kustom-repo:     { source: config, key: forge.mseKustom.repoUrl }
      overlay-location:    { source: config, key: mse.overlayLocation }
      reg-project:         { source: config, key: registry.project }
      minio-host:          { source: config, key: minio.host }
      minio-bucket:        { source: config, key: minio.pipelineBucket }
      # Le tag des images à déployer. Ce pipeline ne construit plus : il éprouve
      # celles que la construction de la release a publiées. Reconstruire ici
      # produisait un artefact différent de celui qu'on livrera, et le verdict
      # portait donc à côté (B17) — même correction que sur l'audit.
      image-tag: { source: input, required: true, suggest: release-tag }
      mse-revision: { source: input, required: true, suggest: git-ref }
      # La branche de l'infrastructure de déploiement vient de la configuration,
      # comme pour l'audit. C'est ce qui rend ce pipeline enchaînable : tant
      # qu'elle était un paramètre d'entrée, le dashboard ne savait pas la
      # renseigner et ne lançait donc jamais les tests d'intégration
      # automatiquement.
      mse-kustom-revision: { source: config, key: forge.mseKustom.revision }
    # Le rapport JUnit, publié comme celui des tests statiques. La Task écrit
    # sous `test-results/integration/`, et c'est ce chemin qui nomme la famille
    # au lecteur — le fichier, lui, s'appelle `junit.xml` comme celui des tests
    # unitaires.
    uploads:
      results:
        param: results-upload-url
        artifact: integration-tests.tar.gz
        family: integration
        format: archive
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: dockerconfig
        secret: { configKey: pipeline.registrySecret }
      - name: mse
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi
      - name: kustomization
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi
