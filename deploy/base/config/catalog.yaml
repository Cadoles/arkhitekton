# Catalogue of the pipelines that can be launched from the dashboard.
#
# This file lives outside the binary, in a ConfigMap, and is validated at the `worker`'s
# start-up against the Pipelines actually deployed: a missing Pipeline, a parameter it does not
# accept, a required parameter left uncovered, a workspace not bound — each prevents start-up
# with a message that names it. Adding a pipeline here requires no code change.
#
# The values are read from real PipelineRuns of the cluster, and not invented: the catalogue
# must reproduce what `mse-tekton`'s TriggerTemplates did.

# Deployment environments, in their promotion order.
#
# The `promotionSuffix` is the metadata Flux expects in the tag, and it is checked at start-up
# against the real ImagePolicies: a mistake here produces no visible failure — the tag is
# pushed, Flux ignores it, and the promotion looks successful.
#
# Note `qualif` → `testing`: Flux knows this environment under its old name. It is an **output**
# mapping, used to build a tag.
#
# The settings under `deployer:` belong to the deployment tool and to it alone. The dashboard
# carries them without reading them — it is the deployer that names and validates them. They
# were previously three catalogue fields, which imposed Flux's vocabulary on every project,
# including those with no deployment tool.
#
# The values are strings, booleans included: that is what a configuration carries, and the
# deployer interprets them.
projects:
  # Each project declares its environments. A project that has the MSE module with no section
  # here has neither promotion nor observation.
  mse-test-project:
    environments:
      - id: unstable
        label: Unstable
        rank: 1
        namespace: mse-dev
        sensitive: false
        deployer:
          promotionSuffix: unstable
          acceptsPrerelease: "true"
          kustomization: portal-unstable

      - id: qualif
        label: Qualification
        rank: 2
        namespace: mse-dev
        sensitive: false
        deployer:
          promotionSuffix: testing
          acceptsPrerelease: "true"
          kustomization: portal-testing

      - id: preprod
        label: Pré-production
        rank: 3
        namespace: mse-dev
        # Receives what goes to the end user: promotion reserved to the releaser role. An environment
        # with no `sensitive` is treated as sensitive.
        sensitive: true
        deployer:
          # The RCs go as far as pre-production; the RC / final release boundary sits between preprod and
          # prod, and not before.
          promotionSuffix: preprod
          acceptsPrerelease: "true"
          kustomization: portal-preprod

      - id: prod
        label: Production
        rank: 4
        namespace: mse-prod
        sensitive: true
        deployer:
          promotionSuffix: prod
          # Without pre-releases: its policy's SemVer range is written without `-0`, which makes an RC
          # structurally ineligible.
          acceptsPrerelease: "false"
          kustomization: portal-prod
        # An independent cluster: neither PortalData, nor Deployment, nor Flux status is readable there.
        # The interface displays it as "not observable", a state distinct from "unknown".
        observable: false

# A global cap, across every queue. The pipelines ask for PVCs and build pods, and nothing
# mechanically stops twenty of them being launched.
#
# It takes precedence over the per-type caps and is not their sum: seven queues of five places
# would allow thirty-five. It is on the other hand high enough for the queues to breathe —
# setting it to four would make the per-type cap decorative, since no type would ever reach its
# own.
maxConcurrentRuns: 10

# The pull secret applied to every pipeline.
#
# All five pull at least one image from `reg.cadoles.com` — `crane` to push, `mktools` to derive
# a tag, `tekton-mse-manager` to deploy — and the project is private. Without this setting, the
# runs failed with `TaskRunImagePullFailed`, before even reaching the step one believed at
# fault.
#
# Global and not repeated per entry: repeating it would have made it forgotten on the next one.
# An entry that declares its own `podTemplate` wins.
#
# Distinct from the dockerconfig mounted as a workspace: that one serves the **pod** to pull its
# tooling from `cnous-mse`, this one serves `crane` to **push** the images produced. Two acts,
# two scopes, potentially two accounts.
podTemplate:
  imagePullSecretsConfigKey: pipeline.imagePullSecret

pipelines:
  # The security audit requires no parameter: the pipeline carries its own default values. It is
  # the simplest kind, and the only one that can be launched without typing anything.
  - kind: security-audit
    # Chained after a successful build, and re-runnable on its own from a release's screen. Decided
    # here and not in Go: it is what **this deployment** checks, and a project with no security
    # audit removes it without recompiling.
    verification: true
    pipelineRef: security-audit
    label: Audit de sécurité
    # No contention: an audit can run during E2E tests.
    timeout: 90m
    # Without these parameters, the pipeline's defaults applied: it scanned `CNOUS/mse` at revision
    # `k8s-unstable`, whatever the dashboard believed it was auditing. An audit that bears on
    # something other than the release is worse than a missing audit — it returns a verdict one
    # attributes to the wrong thing.
    params:
      app-repo-url:        { source: config, key: project.repoUrl }
      app-revision: { source: input,  required: true, suggest: git-ref }
      # The audit also scans the deployment infrastructure and reads its Semgrep rules in
      # `mse-tekton`: three repositories, three accesses to grant to the pipelines' deploy key.
      mse-kustom-repo-url: { source: config, key: forge.mseKustom.repoUrl }
      # The branch too must come from the configuration. The pipeline's default is `unstable`,
      # `CNOUS/mse-kustom`'s convention; a repository that does not carry it failed the clone — hence
      # the whole audit — on "couldn't find remote ref unstable".
      mse-kustom-revision: { source: config, key: forge.mseKustom.revision }
      tekton-repo-url:     { source: config, key: forge.tekton.repoUrl }
      # The audit no longer builds: it analyses the images **already published** by the release's
      # build. Scanning a rebuild would return a verdict on an artifact one does not deliver.
      # `image` says the kind, `image` (the field) says which one: it is here, and not in the
      # dashboard's code, that a parameter is attached to a published repository. The mapping lived in
      # Go, as a `case "portal-image"`, and a pipeline naming its parameters otherwise could not reuse
      # it.
      portal-image:
        { source: input, required: true, suggest: image, image: portal }
      consumer-image:
        { source: input, required: true, suggest: image, image: portal-cli }
      minio-host:          { source: config, key: minio.host }
      minio-bucket:        { source: config, key: minio.pipelineBucket }
    # The normalised report, published to the dashboard through a presigned URL.
    #
    # Without this declaration, the audit published only into the pipelines' bucket, where the
    # dashboard does not read: its findings never reached the security screen, and the `security`
    # signal stayed forever unmeasured although ten scanners had run.
    #
    # Two files rather than an archive: the ingester recognises them by their name under
    # `raw/<run>/`, unpacking nothing.
    uploads:
      summary:
        param: summary-upload-url
        artifact: summary.json
        family: security
        format: file
      findings:
        param: findings-upload-url
        artifact: findings.jsonl
        family: security
        format: file
    # The names differ from the other pipelines' — `shared` and `docker-config`, not `shared-data`
    # and `dockerconfig`. Nothing would guess it: it is the validation against the cluster that
    # imposes them.
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: docker-config
        secret: { configKey: pipeline.registrySecret }
      - name: shared
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 2Gi

  # The promotion: a re-tag of the same digest, never a rebuild. It is the only kind the dashboard
  # launches in order to deploy, and it does not deploy itself — Flux sees the new tag and
  # decides.
  # Building a pre-release's images.
  #
  # It is the link that was missing between "creating a release" and "an image exists": without
  # this entry, a pre-release was born `draft` and stayed there indefinitely, although the
  # `build-image` pipeline existed in the cluster.
  #
  # `version` carries the SemVer tag and takes precedence over `tag-name`: the `generate-image-tag`
  # Task uses it as it is rather than deriving it from the branch, and the same tag leaves as
  # `--build-arg VERSION` to be written into `/app/version.txt`. That is what makes the image
  # identifiable by what it reports about itself, and therefore the version invariant checkable.
  # One run, one image. The pipeline carried the Dockerfile's three targets literally; it now
  # takes one as a parameter, and the dashboard launches as many runs as there are images to
  # produce. Each appears, fails and is re-run separately — a failed `portal-dev` no longer loses
  # the portal that was already built.
  - kind: build
    pipelineRef: build-image
    label: Construction d'image
    # What this pipeline leaves behind it. The dashboard reads its digests and attaches them to the
    # release; a re-tag will be able to take them bit for bit.
    produces: [image]
    # `parallel`: two builds of different versions do not get in each other's way, they write under
    # distinct tags. The registry's serialisation concerns the re-tag only, where two manifests
    # target the same repository.
    params:
      repo-url:    { source: config, key: project.repoUrl }
      reg-project: { source: config, key: registry.project }
      # The Dockerfile and its context come from the **project's declaration**, and not from the
      # deployment's configuration. A repository may carry one Dockerfile per image —
      # `Dockerfile.dev` and `Dockerfile.prod` at its root — rather than a single one with stages,
      # and the configuration could name only one. The dashboard fills them in per image.
      #
      # Optional: a pipeline launched by hand outside the dashboard falls back to the Task's default
      # values, which stay those of an ordinary repository.
      #
      # Label, help and example: these four parameters are **typed in** from the automation tab, and a
      # field named `image-name` with no explanation is a field one fills in wrongly.
      dockerfile:
        source: input
        label: Dockerfile
        help: >-
          Chemin du fichier qui construit cette image, depuis la racine du dépôt.
          Vide : celui du projet.
        placeholder: ./Dockerfile
      context:
        source: input
        label: Contexte de construction
        help: Répertoire envoyé au moteur de build. Presque toujours la racine.
        placeholder: "."
      # The Git reference to build — branch, tag or commit, chosen when the release is created.
      revision: { source: input, required: true, suggest: git-ref }
      # The SemVer tag. Required: leaving it empty would make the Task fall back to deriving by
      # branch, and the image would carry a tag unrelated to the release that asked for it.
      version: { source: input, required: true, suggest: release-tag }
      # The Task's naming fallback when `version` is empty. Passed so that the pipeline stays usable
      # as it is outside the dashboard.
      tag-name: { source: input, required: true, suggest: release-tag }
      # The published repository and the Dockerfile target that feeds it. Two parameters and not one:
      # the mapping belongs to the caller, and a renamed target must not force renaming a repository
      # in the registry.
      image-name:
        source: input
        required: true
        suggest: image-name
        label: Dépôt publié
        help: >-
          Nom court du dépôt d'image, sans le registre ni le tag. C'est aussi le
          nom sous lequel les étapes suivantes désigneront ce qu'il produit.
        placeholder: portal
      target:
        source: input
        required: true
        suggest: build-target
        label: Cible du Dockerfile
        help: >-
          Étape `AS <nom>` qui produit cette image. Sur un Dockerfile sans
          étapes, la dernière.
        placeholder: web
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: dockerconfig
        secret: { configKey: pipeline.registrySecret }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 2Gi

  # A re-tag, and not a "promotion": the pipeline promotes nothing, it sets an extra tag on an
  # existing digest. It is Flux that deploys, by seeing that tag. And the dashboard uses it
  # outside promotion too — giving a final release its own tag from that of its source
  # pre-release — where the word "promotion" was frankly misleading.
  - kind: retag
    pipelineRef: retag-image
    label: Re-tag d'image
    # An image, like `build` — and it is what the `verification` flag could not say: it had only two
    # values for three situations, and `retag` fell into the same box as a pipeline that produces
    # nothing.
    produces: [image]
    # The registry copes badly with two simultaneous re-tags on the same repository: serialising
    # them costs a few seconds and avoids concurrent manifests.
    maxConcurrent: 1
    params:
      reg-project: { source: config, key: registry.project }
      image-name: { source: input, required: true, suggest: image-name }
      old-tag: { source: input, required: true, suggest: release-tag }
      new-tag: { source: input, required: true, suggest: release-tag }
    workspaces:
      # Neither a cloned repository nor an exchanged file: the re-tag handles manifests only. The
      # `git-credentials` workspace it mounted was never used.
      - name: dockerconfig
        secret: { configKey: pipeline.registrySecret }

  # Static analysis — PHP-CS-Fixer and PHPStan.
  #
  # Distinct from the unit tests since they got their own pipeline: "does the code do what is
  # expected" and "is the code written cleanly" are two questions, which the score weighs
  # separately. Merging them gave a single verdict for two signals, and a non-conforming cs-fixer
  # failed the same run as green tests — hence a re-run that replayed both.
  - kind: static-tests
    verification: true
    pipelineRef: php-static-tests
    label: Analyse statique
    params:
      repo-url:     { source: config, key: project.repoUrl }
      revision: { source: input, required: true, suggest: git-ref }
    # Expected artifacts. The dashboard computes each one's key and mints the write URL **before**
    # creating the run: the pipeline therefore has no bucket, no prefix and no MinIO credentials,
    # and the reader has nothing to look for by prefix afterwards.
    uploads:
      results:
        param: results-upload-url
        # PHPStan and cs-fixer each write under `test-results/<tool>/`: one archive, under a key unique
        # to the run. It is the directory that names the family to the reader.
        artifact: static-tests.tar.gz
        family: static
        format: archive
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi

  - kind: unit-tests
    verification: true
    pipelineRef: php-unit-tests
    label: Tests unitaires
    params:
      repo-url:     { source: config, key: project.repoUrl }
      revision: { source: input, required: true, suggest: git-ref }
    uploads:
      results:
        param: results-upload-url
        artifact: unit-tests.tar.gz
        family: unit
        format: archive
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi

  - kind: e2e-tests
    pipelineRef: e2e-test
    label: Tests E2E
    # The line that motivated this declaration. Three artifacts published, and `verification: false`
    # — not because it would produce no results, but because the flag spoke of **chaining**: an E2E
    # campaign targets a shared environment and does not start by default after a build.
    #
    # Both axes are now named separately. Its reports are read, and it stays launched on demand.
    produces: [results]
    # An E2E campaign runs against a shared environment: two simultaneous runs would skew each
    # other.
    # One at a time: it deploys or measures a single target, and two simultaneous runs would tread
    # on each other.
    maxConcurrent: 1
    timeout: 60m
    params:
      repo-url:     { source: config, key: forge.e2e.repoUrl }
      revision: { source: input, required: true, suggest: git-ref }
      environment: { source: input, required: true, suggest: environment }
    # Three distinct artifacts, three URLs. The file names Cypress produces depend on the specs run:
    # nobody can presign them one by one, and each directory therefore leaves as an archive.
    uploads:
      reports:
        param: reports-upload-url
        artifact: e2e-reports.tar.gz
        family: e2e
        format: archive
      videos:
        param: videos-upload-url
        artifact: e2e-videos.tar.gz
        family: e2e
        format: archive
      screenshots:
        param: screenshots-upload-url
        artifact: e2e-screenshots.tar.gz
        family: e2e
        format: archive
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi

  - kind: integration-tests
    verification: true
    pipelineRef: php-integration-test
    label: Tests d'intégration
    # The pipeline deploys into an application namespace: two simultaneous runs would share the same
    # target.
    # One at a time: it deploys or measures a single target, and two simultaneous runs would tread
    # on each other.
    maxConcurrent: 1
    serviceAccountName: tekton-kubectl
    timeout: 45m
    params:
      mse-repo:            { source: config, key: project.repoUrl }
      mse-kustom-repo:     { source: config, key: forge.mseKustom.repoUrl }
      overlay-location:    { source: config, key: mse.overlayLocation }
      reg-project:         { source: config, key: registry.project }
      minio-host:          { source: config, key: minio.host }
      minio-bucket:        { source: config, key: minio.pipelineBucket }
      # The tag of the images to deploy. This pipeline no longer builds: it exercises those the
      # release's build published. Rebuilding here produced an artifact different from the one that
      # will be delivered, and the verdict therefore fell wide — the same fix as on the audit.
      image-tag: { source: input, required: true, suggest: release-tag }
      mse-revision: { source: input, required: true, suggest: git-ref }
      # The deployment infrastructure's branch comes from the configuration, as for the audit. That is
      # what makes this pipeline chainable: while it was an input parameter, the dashboard did not
      # know how to fill it in and therefore never launched the integration tests automatically.
      mse-kustom-revision: { source: config, key: forge.mseKustom.revision }
    # The JUnit report, published like the static tests'. The Task writes under
    # `test-results/integration/`, and it is that path which names the family to the reader — the
    # file itself is called `junit.xml`, like the unit tests'.
    uploads:
      results:
        param: results-upload-url
        artifact: integration-tests.tar.gz
        family: integration
        format: archive
    workspaces:
      - name: git-credentials
        secret: { configKey: pipeline.gitSecret }
      - name: dockerconfig
        secret: { configKey: pipeline.registrySecret }
      - name: mse
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi
      - name: kustomization
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi
