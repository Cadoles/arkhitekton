# Catalogue des pipelines lançables depuis le dashboard.
#
# Ce fichier vit hors du binaire, en ConfigMap, et il est validé au démarrage du
# `worker` contre les Pipeline réellement déployés : Pipeline absent, paramètre
# qu'il n'accepte pas, paramètre requis non couvert, workspace non lié — chacun
# empêche le démarrage avec un message qui le nomme (doc 06 §6.2). Y ajouter un
# pipeline ne demande aucune modification du code.
#
# Les valeurs sont relevées sur des PipelineRun réels du cluster, et non
# inventées : le catalogue doit reproduire ce que faisaient les TriggerTemplate
# de `mse-tekton`.

# Environnements de déploiement, dans leur ordre de promotion.
#
# Le `promotionSuffix` est la métadonnée que Flux attend dans le tag, et il est
# vérifié au démarrage contre les ImagePolicy réelles : une erreur ici ne produit
# aucun échec visible — le tag est poussé, Flux l'ignore, et la promotion paraît
# réussie (B7).
#
# Noter `qualif` → `testing` : Flux connaît cet environnement sous son ancien nom.
# C'est une correspondance de **sortie**, employée pour construire un tag.
environments:
  - id: unstable
    label: Unstable
    promotionSuffix: unstable
    acceptsPrerelease: true
    rank: 1
    namespace: mse-dev
    fluxKustomization: portal-unstable

  - id: qualif
    label: Qualification
    promotionSuffix: testing
    acceptsPrerelease: true
    rank: 2
    namespace: mse-dev
    fluxKustomization: portal-testing

  - id: preprod
    label: Pré-production
    # Les RC vont jusqu'en pré-production ; la frontière RC / release finale se
    # situe entre preprod et prod, et non avant.
    promotionSuffix: preprod
    acceptsPrerelease: true
    rank: 3
    namespace: mse-dev
    fluxKustomization: portal-preprod

  - id: prod
    label: Production
    promotionSuffix: prod
    # Sans pré-releases : la plage SemVer de sa politique s'écrit sans `-0`, ce
    # qui rend une RC structurellement inéligible.
    acceptsPrerelease: false
    rank: 4
    namespace: mse-prod
    fluxKustomization: portal-prod
    # Cluster indépendant : ni PortalData, ni Deployment, ni statut Flux n'y sont
    # lisibles. L'interface l'affiche « non observable », état distinct de
    # « inconnu » (B8).
    observable: false

# Plafond global. Les pipelines demandent des PVC et des pods de build, et rien
# n'empêche mécaniquement d'en lancer vingt.
maxConcurrentRuns: 4

pipelines:
  # L'audit de sécurité n'exige aucun paramètre : le pipeline porte ses propres
  # valeurs par défaut. C'est le kind le plus simple, et le seul lançable sans
  # rien saisir.
  - kind: security-audit
    pipelineRef: security-audit
    label: Audit de sécurité
    # Aucune contention : un audit peut tourner pendant des tests E2E.
    queueClass: parallel
    timeout: 90m
    # Les noms diffèrent de ceux des autres pipelines — `shared` et
    # `docker-config`, non `shared-data` et `dockerconfig`. Rien ne le devinerait :
    # c'est la validation contre le cluster qui les impose.
    workspaces:
      - name: git-credentials
        secret: { secretName: git-credentials }
      - name: docker-config
        secret: { secretName: regcred }
      - name: shared
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 2Gi

  # La promotion : un re-tag du même digest, jamais une reconstruction. C'est le
  # seul kind que le dashboard lance pour déployer, et il ne déploie pas
  # lui-même — Flux constate le nouveau tag et décide (B7).
  - kind: promote
    pipelineRef: promote-image
    label: Promotion d'image
    # Le registre supporte mal deux re-tags simultanés sur le même dépôt : les
    # sérialiser coûte quelques secondes et évite des manifestes concurrents.
    queueClass: exclusive-registry
    params:
      reg-project: { source: config, key: registry.project }
      old-tag:     { source: input, required: true }
      new-tag:     { source: input, required: true }
    workspaces:
      - name: git-credentials
        secret: { secretName: git-credentials }
      - name: dockerconfig
        secret: { secretName: regcred }

  - kind: static-tests
    pipelineRef: php-static-tests
    label: Tests statiques
    queueClass: parallel
    params:
      repo-url:     { source: config, key: forge.mse.repoUrl }
      revision:     { source: input, required: true }
      # Le commit sert au retour de statut vers Gitea : sans lui, la PR ne voit
      # jamais le résultat.
      commit:       { source: input, required: true }
    # Artefacts attendus. Le dashboard calcule la clé de chacun et mint l'URL
    # d'écriture **avant** de créer le run : le pipeline n'a donc ni bucket, ni
    # préfixe, ni identifiants MinIO, et le lecteur n'a rien à chercher par
    # préfixe ensuite (B14).
    uploads:
      results:
        param: results-upload-url
        # Les trois familles écrivent sous `test-results/`, et leur nombre dépend
        # de ce qui a tourné : une archive, sous une clé unique par run.
        artifact: static-tests.tar.gz
        family: static
        format: archive
    workspaces:
      - name: git-credentials
        secret: { secretName: git-credentials }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi

  - kind: e2e-tests
    pipelineRef: e2e-test
    label: Tests E2E
    # Une campagne E2E s'exécute contre un environnement partagé : deux
    # exécutions simultanées se fausseraient mutuellement.
    queueClass: exclusive-e2e
    timeout: 60m
    params:
      repo-url:     { source: config, key: forge.e2e.repoUrl }
      revision:     { source: input, required: true }
      environment:  { source: input, required: true }
    # Trois artefacts distincts, trois URLs. Les noms de fichiers produits par
    # Cypress dépendent des specs exécutées : personne ne peut les pré-signer un
    # par un, et chaque répertoire part donc en une archive.
    uploads:
      reports:
        param: reports-upload-url
        artifact: e2e-reports.tar.gz
        family: e2e
        format: archive
      videos:
        param: videos-upload-url
        artifact: e2e-videos.tar.gz
        family: e2e
        format: archive
      screenshots:
        param: screenshots-upload-url
        artifact: e2e-screenshots.tar.gz
        family: e2e
        format: archive
    workspaces:
      - name: git-credentials
        secret: { secretName: git-credentials }
      - name: shared-data
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi

  - kind: integration-tests
    pipelineRef: php-integration-test
    label: Tests d'intégration
    # Le pipeline déploie dans un namespace applicatif : deux exécutions
    # simultanées partageraient la même cible.
    queueClass: exclusive-mse-pipeline
    serviceAccountName: tekton-kubectl
    timeout: 45m
    params:
      mse-repo:            { source: config, key: forge.mse.repoUrl }
      mse-kustom-repo:     { source: config, key: forge.mseKustom.repoUrl }
      overlay-location:    { source: config, key: mse.overlayLocation }
      reg-project:         { source: config, key: registry.project }
      dockerfile:          { source: config, key: mse.dockerfile }
      context:             { source: literal, value: "./" }
      tag-name:            { source: config, key: mse.pipelineTag }
      minio-host:          { source: config, key: minio.host }
      minio-bucket:        { source: config, key: minio.pipelineBucket }
      mse-revision:        { source: input, required: true }
      mse-kustom-revision: { source: input, required: true }
    workspaces:
      - name: git-credentials
        secret: { secretName: git-credentials }
      - name: dockerconfig
        secret: { secretName: regcred }
      - name: mse
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi
      - name: kustomization
        volumeClaimTemplate:
          accessModes: [ReadWriteOnce]
          storageClassName: standard
          storage: 1Gi
