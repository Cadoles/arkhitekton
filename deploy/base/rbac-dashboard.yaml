# The dashboard's rights in its own namespace.
#
# A single need: the `worker`'s leader election. The Deployment runs with `replicas: 1`, which is
# not enough — during a rolling update two pods briefly coexist, and that is exactly the instant
# when a duplicated scheduler would launch the same pipeline twice. The Lease closes that window.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arkhitekton-leader
  namespace: arkhitekton
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arkhitekton-leader
  namespace: arkhitekton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arkhitekton-leader
subjects:
  - kind: ServiceAccount
    name: arkhitekton
    namespace: arkhitekton
