apiVersion: v1
kind: Service
metadata:
  name: arkhitekton-api
  namespace: arkhitekton
  labels:
    app.kubernetes.io/name: arkhitekton
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: arkhitekton
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
  # Une session OIDC vit en base, pas en mémoire du pod : n'importe quelle
  # réplique sait servir n'importe quel utilisateur, et aucune affinité de session
  # n'est nécessaire. C'est le bénéfice direct du choix BFF de la doc 07.
  sessionAffinity: None
