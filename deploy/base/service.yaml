apiVersion: v1
kind: Service
metadata:
  name: arkhitekton-api
  namespace: arkhitekton
  labels:
    app.kubernetes.io/name: arkhitekton
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: arkhitekton
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
  # An OIDC session lives in the database, not in the pod's memory: any replica can serve any user,
  # and no session affinity is needed. It is the direct benefit of the BFF choice.
  sessionAffinity: None
