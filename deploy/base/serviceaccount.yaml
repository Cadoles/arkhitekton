apiVersion: v1
kind: ServiceAccount
metadata:
  name: arkhitekton
  namespace: arkhitekton
# The token is mounted only where it serves. The `api` role does not speak to the Kubernetes API;
# mounting a token for it would give it a capability it never exercises, and that an arbitrary
# code execution defect could exercise in its place. The Deployments that need it set it back to
# true explicitly.
automountServiceAccountToken: false
