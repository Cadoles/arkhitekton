apiVersion: v1
kind: ServiceAccount
metadata:
  name: arkhitekton
  namespace: arkhitekton
# Le jeton n'est monté que là où il sert. Le rôle `api` ne parle pas à l'API
# Kubernetes ; lui monter un jeton lui donnerait une capacité qu'il n'exerce
# jamais, et qu'un défaut d'exécution de code arbitraire pourrait exercer à sa
# place. Les Deployments qui en ont besoin la remontent explicitement à true.
automountServiceAccountToken: false
