# Droits du dashboard dans le namespace des pipelines.
#
# La liste suit doc 07 §7.3. Ce qui en est absent l'est volontairement :
#
#   - la **lecture** des secrets : le dashboard n'a aucune raison de lire ceux de
#     Tekton, et ce namespace en contient (registre, clé SSH partagée, MinIO). Il
#     en crée en revanche depuis le lot G — une clé de déploiement par projet —,
#     et en RBAC Kubernetes les verbes sont indépendants : `create`, `patch` et
#     `delete` s'accordent sans `get` ni `list`. Un rôle qui possède ce qu'il
#     crée sans rien pouvoir lire du namespace est donc exprimable, et il honore
#     le motif d'origine à la lettre (doc 12 §12.7).
#   - `pods/exec` : la collecte de logs passe par `pods/log`, jamais par une
#     exécution dans un conteneur.
#   - l'écriture sur les `pipelines` et `tasks` du **noyau** : construire et
#     re-taguer arrivent avec le binaire, par sa kustomization, comme le Job de
#     migration. Le dashboard ne les modifie pas à l'exécution.
#
#     Il écrit en revanche les implémentations de **référence** — les Task d'une
#     pile, posées quand un projet la déclare (doc 12 §12.6, lot G). Il ne pose
#     que ce qu'il nomme, marque ce qu'il possède, et n'adopte jamais une
#     définition qu'un tiers maintient : sur un cluster où `mse-tekton` a déjà
#     posé les siennes, il constate et se retire.
#
# Ce fichier porte un namespace en dur, différent de celui du reste du dépôt.
# C'est la raison pour laquelle aucun transformateur `namespace:` n'est déclaré
# dans les kustomization : il déplacerait cette Role vers `mse-dashboard`, où elle
# n'accorderait rien, sans le moindre message d'erreur.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mse-dashboard-tekton
  namespace: mse-tekton-pipelines
rules:
  # Lecture des définitions : le catalogue de pipelines du dashboard est validé au
  # démarrage contre ce qui existe réellement dans le cluster.
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "tasks"]
    # `create` et `update` pour la bibliothèque de référence ; pas `delete` :
    # retirer un pipeline que des runs référencent encore les rendrait
    # inexplicables, et retirer une pile est un geste assez rare pour rester
    # manuel.
    verbs: ["get", "list", "watch", "create", "update"]
  # Pilotage des exécutions. `patch` sert uniquement à poser
  # `spec.status: Cancelled` ; `delete` au nettoyage des runs créés par le
  # dashboard.
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list", "watch"]
  # Collecte des logs.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Écriture des secrets que le dashboard **possède** : une clé de déploiement
  # par projet, dont il ne conserve que la moitié publique.
  #
  # Sans `get` ni `list`, et c'est structurant plutôt que décoratif : n'ayant
  # aucun moyen de demander au cluster si un secret lui appartient, le dashboard
  # lit sa propriété dans sa base — `projects.deploy_key_public` — et refuse
  # d'adopter un secret préexistant. La restriction produit la garantie.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "update", "delete"]
  # La liste des secrets montables du compte de service des pipelines.
  #
  # `kubernetes.io/enforce-mountable-secrets: "true"` est ce qui empêche
  # réellement une Task de se servir dans le namespace. En devenant propriétaire
  # de secrets, le dashboard devient responsable de ce qui peut les monter : il
  # n'ajoute que les noms qu'il dérive lui-même d'un projet, et ne retire jamais
  # une entrée qu'il n'a pas posée.
  #
  # `get` est ici accordé : un compte de service n'est pas un secret, et sans
  # lui la liste ne pourrait être modifiée qu'en l'écrasant — ce qui élaguerait
  # les identifiants du déploiement.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "update", "patch"]
  # Diagnostic d'un run qui ne démarre pas : PVC non lié, image non tirée, quota
  # atteint. Sans les events, l'interface ne peut afficher que « en attente ».
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mse-dashboard-tekton
  namespace: mse-tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mse-dashboard-tekton
subjects:
  - kind: ServiceAccount
    name: mse-dashboard
    namespace: mse-dashboard
