apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` transformer is declared, here or in the overlays.
#
# The reason is in rbac-tekton.yaml: that Role lives in the pipelines' namespace. A global
# transformer would move it to `arkhitekton`, where it would grant nothing — with no error, no
# warning, and the symptom would be a "forbidden" at the first PipelineRun creation. Each
# resource therefore carries its namespace explicitly.

resources:
  # The pipeline core the dashboard owns: build and re-tag. Its nested kustomization carries its
  # own namespace — the pipelines' — which is the only exception to the rule above, and it is
  # bounded to its own resources.
  - pipelines

  - namespace.yaml
  - serviceaccount.yaml
  - rbac-dashboard.yaml
  - rbac-tekton.yaml
  - job-migrate.yaml
  - deployment-api.yaml
  - deployment-worker.yaml
  - service.yaml
  - ingress.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: arkhitekton
      app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  # The pipeline catalogue, mounted as a file. The `worker` validates it at start-up against the
  # deployed Pipelines; the `api` uses it to say what can be launched and which parameters are
  # required.
  - name: arkhitekton-catalog
    namespace: arkhitekton
    files:
      - catalog.yaml=config/catalog.yaml

  # Only the values that are identical everywhere appear here. Everything that depends on the
  # environment — public URL, OIDC provider, MinIO endpoint, list of bootstrap administrators — is
  # added by the overlay with `behavior: merge`.
  #
  # The hash suffix is kept (no `disableNameSuffixHash`): changing a value produces a new
  # ConfigMap name, hence a new podTemplate, hence a restart. Without it, a configuration change
  # would be applied to the object with no pod ever reading it again.
  #
  # `namespace` is mandatory here, and its absence is a silent trap: an object generated with no
  # namespace lands in `default`, and above all kustomize stops recognising the references made
  # from the Deployments — the `configMapRef` entries keep the name with no hash suffix. The build
  # stays green, the deployment fails with CreateContainerConfigError.
  - name: arkhitekton-config
    namespace: arkhitekton
    literals:
      - HTTP_ADDR=:8080
      - HTTP_READ_TIMEOUT=15s
      - HTTP_WRITE_TIMEOUT=60s
      - HTTP_SHUTDOWN_TIMEOUT=20s
      - DATABASE_MAX_CONNS=10
      - DATABASE_CONN_MAX_LIFETIME=1h
      - MINIO_BUCKET=arkhitekton
      # Must cover the longest pipeline — 90 min for `security-audit` — without exceeding what is
      # reasonable for a write capability. The binary refuses to start below 90m.
      - MINIO_PRESIGN_TTL=2h
      - OIDC_SCOPES=openid,profile,email
      - SESSION_TTL=12h
      # An overlay whose pipelines run elsewhere moves the Tekton Role and definitions with it.
      - TEKTON_NAMESPACE=arkhitekton-pipelines

images:
  # Substituted by each overlay. `latest` is deliberately wrong: an overlay that forgot to set the
  # tag would deploy a non-deterministic image, and it is better that this shows.
  - name: reg.cadoles.com/vcarroy/arkhitekton
    newTag: latest
