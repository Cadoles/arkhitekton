# Schema migration, outside the application pods' life cycle.
#
# Why a Job and not an initContainer: an initContainer would run once per replica, hence twice
# in parallel on the `api`, and goose does not take a session lock by default. Two concurrent
# `goose up` runs on a fresh database tread on each other.
#
# The price is known: a Job's `spec.template` is immutable. Reapplying this manifest after an
# image change fails with "field is immutable". `make deploy` therefore deletes the Job before
# applying — it is the price of a single artifact for the three roles, and it is paid once per
# deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: arkhitekton-migrate
  namespace: arkhitekton
  labels:
    app.kubernetes.io/name: arkhitekton
    app.kubernetes.io/component: migrate
spec:
  # The migrations are idempotent: goose picks up where it stopped. A database not reachable yet
  # at the first attempt is the common case on a cluster that is starting, and it does not justify
  # failing the deployment.
  backoffLimit: 3
  # The Job disappears an hour after it succeeds. Without that, finished Jobs accumulate and hide
  # the one that has just failed.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arkhitekton
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: arkhitekton
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: reg.cadoles.com/vcarroy/arkhitekton:latest
          args: ["migrate"]
          # The `migrate` role validates neither OIDC nor MinIO: DATABASE_URL is enough for it. The
          # complete ConfigMap and Secret are mounted anyway — an identical set of variables for the three
          # roles avoids a renamed variable being fixed in two places out of three.
          envFrom:
            - configMapRef:
                name: arkhitekton-config
            - secretRef:
                name: arkhitekton-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
