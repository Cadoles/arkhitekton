# Reading the Flux objects.
#
# The dashboard does not drive Flux: it reads it. Promotion is limited to pushing a tag to the
# registry, and it is Flux that then decides what to deploy. Granting the slightest write verb
# here would give the dashboard a second path for acting on the environments, beside the one
# that is traced.
#
# Two distinct uses:
#
#   - at start-up, validating the `environments` table against the real `ImagePolicy` objects —
#     `promotion_suffix` against `filterTags`, `accepts_prerelease` against the SemVer range. It
#     is the guard rail against a promotion that is silently without effect;
#   - in operation, the reconciliation state of the `Kustomization` objects, which feeds
#     `flux_state`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arkhitekton-flux
  namespace: flux-system
rules:
  - apiGroups: ["image.toolkit.fluxcd.io"]
    resources: ["imagepolicies", "imagerepositories", "imageupdateautomations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  # The `GitRepository` carries the URL and the branch Flux rewrites: it is what says where to read
  # the promotion commits, the only source available for production, whose cluster is out of reach.
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arkhitekton-flux
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arkhitekton-flux
subjects:
  - kind: ServiceAccount
    name: arkhitekton
    namespace: arkhitekton
