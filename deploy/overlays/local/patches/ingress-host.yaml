# The base's host is `dashboard.invalid`, unusable by construction. This one follows the
# convention already in place on kind (`*.mse.local`), resolved to the address MetalLB assigns to
# the ingress controller.
#
# `rules` has no merge key: the list is replaced as a block, not merged. The rule must therefore
# be given again in full.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arkhitekton
  namespace: arkhitekton
spec:
  rules:
    - host: dashboard.mse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arkhitekton-api
                port:
                  name: http
