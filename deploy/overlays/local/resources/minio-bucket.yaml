# Création du bucket — développement uniquement.
#
# `blob.Open` refuse de démarrer si le bucket est absent : sans cette
# vérification, un identifiant erroné passerait le démarrage et la panne
# apparaîtrait à la première publication d'artefact, soit à la fin d'un pipeline.
# La contrepartie est qu'il faut créer le bucket avant les pods applicatifs.
#
# Aucun shell n'est invoqué : l'entrypoint de l'image est `mc` lui-même, et
# l'alias passe par MC_HOST_<nom>, ce qui évite un `mc alias set` préalable —
# donc un `sh -c` dans une image qui n'en garantit pas la présence.
apiVersion: batch/v1
kind: Job
metadata:
  name: mse-dashboard-minio-bucket
  namespace: mse-dashboard
  labels:
    app.kubernetes.io/name: mse-dashboard
    app.kubernetes.io/component: minio-bucket
spec:
  # Généreux à dessein : le Job démarre en même temps que MinIO et échoue tant
  # que le serveur n'accepte pas de connexion. Les réessais tiennent lieu
  # d'attente, sans boucle de sondage à écrire.
  backoffLimit: 30
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mse-dashboard
        app.kubernetes.io/component: minio-bucket
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mse-dashboard-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mse-dashboard-secrets
                  key: MINIO_SECRET_KEY
            # Kubernetes résout $(VAR) à partir des variables déclarées avant.
            # Les identifiants apparaissent donc dans une URL : ils doivent être
            # sûrs pour un composant d'URL, d'où la consigne de les garder
            # alphanumériques dans dashboard.env.example.
            - name: MC_HOST_local
              value: "http://$(MINIO_ACCESS_KEY):$(MINIO_SECRET_KEY)@mse-dashboard-minio:9000"
          args:
            - "--config-dir"
            - "/tmp/mc"
            - "mb"
            - "--ignore-existing"
            - "local/mse-dashboard"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
