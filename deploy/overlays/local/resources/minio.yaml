# MinIO de développement — jamais déployé ailleurs.
#
# Instance propre au dashboard, et non celle de `mse-dev` : le bucket
# `mse-dashboard` doit rester distinct de `mse-pipeline` pour que rétention et
# droits soient indépendants (doc 03 §3.5). Partager l'instance de l'application
# rendrait aussi un `mc rb` malencontreux capable d'emporter les deux.
#
# Rappel de la doc 11 §11.5 : MinIO en local gère nativement SigV4, ce qui ne dit
# rien de `nuo-s3.nuonet.fr`. Un succès ici n'est pas une validation de la cible.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mse-dashboard-minio
  namespace: mse-dashboard
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mse-dashboard-minio
  namespace: mse-dashboard
  labels:
    app.kubernetes.io/name: mse-dashboard
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mse-dashboard
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mse-dashboard
        app.kubernetes.io/component: minio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: mse-dashboard-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mse-dashboard-secrets
                  key: MINIO_SECRET_KEY
            # MinIO écrit sa configuration client sous $HOME. Sans redirection
            # vers un volume inscriptible, le FS racine en lecture seule la
            # ferait échouer.
            - name: HOME
              value: /tmp
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mse-dashboard-minio
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mse-dashboard-minio
  namespace: mse-dashboard
spec:
  selector:
    app.kubernetes.io/name: mse-dashboard
    app.kubernetes.io/component: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
