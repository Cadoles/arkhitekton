# Observing an application environment — here `mse-dev`, which stands in for every environment
# locally.
#
# One Role per application namespace, strictly read-only. It lives in the overlay and not in the
# base because the list of observed namespaces is specific to each installation: in production
# there is one per environment, and production itself is in an independent cluster, hence absent.
#
# No write permission. Were a controlled restart after a re-tag to prove necessary, it would go
# through a dedicated Tekton pipeline using the existing `tekton-kubectl` account, and not
# through a widening of these rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arkhitekton-observer
  namespace: mse-dev
rules:
  # Reading the images and the digests actually running.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # PortalData is the only source coming from the application while running, and the only one to
  # say whether the migrations completed. A deployed image whose migrations failed is not a
  # delivered version, and nothing else says so.
  - apiGroups: ["mse.cnous.fr"]
    resources: ["portaldata"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arkhitekton-observer
  namespace: mse-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arkhitekton-observer
subjects:
  - kind: ServiceAccount
    name: arkhitekton
    namespace: arkhitekton
