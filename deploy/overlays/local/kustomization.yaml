apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # PostgreSQL and MinIO in the cluster: development only. In production they are CloudNativePG and
  # `nuo-s3.nuonet.fr`, which are not described here.
  - resources/postgres.yaml
  - resources/minio.yaml
  - resources/minio-bucket.yaml
  # Observation de l'environnement applicatif local.

# The pipelines' credentials, to exercise the chain on a test repository.
#
# Optional, and that is the point: `mse-tekton`'s `git-credentials` and `regcred` defaults suit
# whoever works on the real application, and the overlay must render with no secret file
# existing at all. Making these generators unconditional would fail `skaffold run` for everyone.
#
#   make pipeline-credentials     # builds the three files
#   then uncomment the line below
components:
  - components/pipeline-credentials

patches:
  - path: patches/ingress-host.yaml

configMapGenerator:
  - name: arkhitekton-config
    namespace: arkhitekton
    behavior: merge
    literals:
      - PUBLIC_URL=http://dashboard.mse.local
      - OIDC_REDIRECT_URL=http://dashboard.mse.local/api/v1/auth/callback
      # The fully qualified name, and not the short one: the presigned write URLs are minted with this
      # host then handed to the pipelines, which run in `mse-tekton-pipelines`. The short name does not
      # resolve there — publication failed on "Could not resolve host", after tests that nonetheless
      # passed.
      - MINIO_ENDPOINT=arkhitekton-minio.arkhitekton.svc.cluster.local:9000
      - MINIO_USE_SSL=false
      # `NUO-Region` is the production instance's region. Locally, MinIO accepts any region provided
      # the client signs with the same one; keeping `us-east-1` here makes it visible that the
      # production value is not exercised, rather than letting one believe the opposite.
      - MINIO_REGION=us-east-1
      # The kind cluster's registry, served over HTTP: where plugins are published to be installed.
      - PLUGIN_PLAIN_HTTP_REGISTRIES=registry-mse:5000

secretGenerator:
  # A file that is not versioned (see .gitignore), with a template in dashboard.env.example.
  #
  # It also carries two values that are not secrets — OIDC_CLIENT_ID and BOOTSTRAP_ADMINS — because
  # they are specific to each developer. Putting them in the versioned ConfigMap would force
  # everyone to modify a file tracked by git in order to write their own identifier into it, which
  # always ends up being committed by accident.
  #
  # The order of the `envFrom` entries in the Deployments puts the Secret after the ConfigMap: this
  # file can therefore redefine any variable above.
  - name: arkhitekton-secrets
    namespace: arkhitekton
    envs:
      - secrets/dashboard.env

images:
  - name: reg.cadoles.com/vcarroy/arkhitekton
    newName: reg.cadoles.com/vcarroy/arkhitekton
    # The tag carries the commit the image comes from. Republishing under the same tag would not be
    # enough to make the cluster take the image again: the pods set no `imagePullPolicy`, so
    # `IfNotPresent` applies as soon as the tag is not `latest`. To iterate without committing, pin
    # `digest` instead of `newTag`.
    newTag: dev
