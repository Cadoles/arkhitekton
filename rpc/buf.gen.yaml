# `make proto` regenerates pluginv1 from proto/. The generated code is committed: building
# arkhitekton or a plugin needs neither buf nor protoc.
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: .
    opt: [module=forge.cadoles.com/vcarroy/arkhitekton/rpc]
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: .
    opt: [module=forge.cadoles.com/vcarroy/arkhitekton/rpc]
